name: Repair Electro assets once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/repair-electro-assets-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repack semantically valid Electro GLBs
        shell: python
        run: |
          import base64
          import copy
          import json
          import math
          import struct
          import subprocess
          from pathlib import Path

          SOURCE_REF = "35b8aaca906e1fdf48bae56feb4bb94b84814861"
          NORMAL_PATH = "assets/models/creatures/slime_electro/slime_electro.gltf"
          LARGE_PATH = "assets/models/creatures/slime_electro_large/slime_electro_large.gltf"
          NORMAL_OUT = Path("assets/models/creatures/slime_electro/slime_electro.glb")
          LARGE_OUT = Path("assets/models/creatures/slime_electro_large/slime_electro_large.glb")
          WIDTH = {"SCALAR": 1, "VEC2": 2, "VEC3": 3, "VEC4": 4}
          COMPONENT = {5123: ("H", 2), 5126: ("f", 4)}

          def source(path):
              return json.loads(subprocess.check_output(["git", "show", f"{SOURCE_REF}:{path}"], text=True))

          def decoded_buffer(doc):
              return base64.b64decode(doc["buffers"][0]["uri"].split(",", 1)[1])

          normal_source = source(NORMAL_PATH)
          large_source = source(LARGE_PATH)
          normal_bytes = decoded_buffer(normal_source)
          large_bytes = decoded_buffer(large_source)

          normal_offsets = {
              0: 0, 1: 864, 2: 2016, 3: 2856, 4: 2904, 5: 2936,
              9: 7660, 10: 7672, 11: 7708, 12: 7720, 13: 7756, 14: 7768,
              15: 7804, 16: 7816, 17: 7852, 18: 7864, 19: 7900, 20: 7912,
          }
          large_offsets = {
              0: 0, 1: 864, 2: 2064, 3: 2904, 4: 2952, 5: 2984,
              6: 2996, 7: 3740, 8: 4732,
              9: 5236, 10: 5248, 11: 5284, 12: 5296, 13: 5332, 14: 5344,
              15: 5380, 16: 5392, 17: 5428, 18: 5440, 19: 5476, 20: 5488,
          }

          def accessor_size(accessor, count=None):
              count = accessor["count"] if count is None else count
              _, component_size = COMPONENT[accessor["componentType"]]
              return WIDTH[accessor["type"]] * component_size * count

          def unpack(buf, accessor, offset, count=None):
              count = accessor["count"] if count is None else count
              fmt_char, _ = COMPONENT[accessor["componentType"]]
              total = WIDTH[accessor["type"]] * count
              return list(struct.unpack_from("<" + fmt_char * total, buf, offset))

          def pack(accessor, values):
              fmt_char, _ = COMPONENT[accessor["componentType"]]
              return struct.pack("<" + fmt_char * len(values), *values)

          def float32(value):
              return struct.unpack("<f", struct.pack("<f", float(value)))[0]

          def refresh_bounds(accessor, values):
              if "min" not in accessor and "max" not in accessor:
                  return
              width = WIDTH[accessor["type"]]
              rows = [values[i:i+width] for i in range(0, len(values), width)]
              accessor["min"] = [float(min(row[j] for row in rows)) for j in range(width)]
              accessor["max"] = [float(max(row[j] for row in rows)) for j in range(width)]

          # Recover the valid large Electro details mesh. The old JSON declared 276
          # indices, but the binary contains 252 valid indices followed immediately
          # by animation floats. The details position/color blocks are shifted +48.
          large_detail_pos_accessor = large_source["accessors"][6]
          large_detail_color_accessor = large_source["accessors"][7]
          large_detail_index_accessor = large_source["accessors"][8]
          large_detail_positions = unpack(large_bytes, large_detail_pos_accessor, 2996)
          large_detail_colors = unpack(large_bytes, large_detail_color_accessor, 3740)
          large_detail_indices = unpack(large_bytes, large_detail_index_accessor, 4732, count=252)
          assert max(large_detail_indices) < large_detail_pos_accessor["count"]
          assert len(large_detail_indices) == 252

          # Map the valid large detail silhouette into the exact authored bounds of
          # the normal Electro details. This preserves the Electro-specific shape
          # while discarding the stale normal detail metadata/buffer fragment.
          normal_target_min = normal_source["accessors"][6]["min"]
          normal_target_max = normal_source["accessors"][6]["max"]
          large_width = WIDTH[large_detail_pos_accessor["type"]]
          large_rows = [large_detail_positions[i:i+large_width] for i in range(0, len(large_detail_positions), large_width)]
          large_min = [min(row[j] for row in large_rows) for j in range(large_width)]
          large_max = [max(row[j] for row in large_rows) for j in range(large_width)]
          normal_detail_positions = []
          for row in large_rows:
              for axis, value in enumerate(row):
                  span = large_max[axis] - large_min[axis]
                  t = 0.0 if abs(span) < 1e-12 else (value - large_min[axis]) / span
                  mapped = normal_target_min[axis] + t * (normal_target_max[axis] - normal_target_min[axis])
                  normal_detail_positions.append(float32(mapped))

          def repack(doc, source_buf, offsets, output, overrides=None):
              doc = copy.deepcopy(doc)
              overrides = overrides or {}
              new_binary = bytearray()
              new_views = []

              for index, accessor in enumerate(doc["accessors"]):
                  override = overrides.get(index)
                  if override is not None:
                      values = override["values"]
                      if "count" in override:
                          accessor["count"] = override["count"]
                  else:
                      if index not in offsets:
                          raise RuntimeError(f"missing recovered offset for accessor {index} in {output}")
                      values = unpack(source_buf, accessor, offsets[index])

                  # Round floats through their actual on-disk representation before
                  # calculating bounds, so metadata and bytes agree exactly.
                  if accessor["componentType"] == 5126:
                      values = [float32(value) for value in values]
                  data = pack(accessor, values)
                  new_binary.extend(b"\0" * (-len(new_binary) % 4))
                  byte_offset = len(new_binary)
                  new_binary.extend(data)

                  old_view = doc["bufferViews"][accessor["bufferView"]]
                  view = {"buffer": 0, "byteOffset": byte_offset, "byteLength": len(data)}
                  if "target" in old_view:
                      view["target"] = old_view["target"]
                  new_views.append(view)
                  accessor["bufferView"] = len(new_views) - 1
                  accessor.pop("byteOffset", None)
                  refresh_bounds(accessor, values)

              # Verify primitive attribute counts and index ranges before packaging.
              for mesh in doc.get("meshes", []):
                  for primitive in mesh.get("primitives", []):
                      position_index = primitive["attributes"]["POSITION"]
                      position_count = doc["accessors"][position_index]["count"]
                      for semantic, accessor_index in primitive["attributes"].items():
                          if doc["accessors"][accessor_index]["count"] != position_count:
                              raise RuntimeError(f"{output}: {semantic} count does not match POSITION")
                      if "indices" in primitive:
                          accessor_index = primitive["indices"]
                          view = new_views[doc["accessors"][accessor_index]["bufferView"]]
                          values = unpack(new_binary, doc["accessors"][accessor_index], view["byteOffset"])
                          if max(values) >= position_count:
                              raise RuntimeError(f"{output}: index {max(values)} >= {position_count}")

              doc["bufferViews"] = new_views
              doc["buffers"] = [{"byteLength": len(new_binary)}]
              doc.setdefault("asset", {})["generator"] = "Asteria Electro semantic repair 0.68.47"

              json_chunk = json.dumps(doc, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              json_chunk += b" " * (-len(json_chunk) % 4)
              bin_chunk = bytes(new_binary)
              bin_chunk += b"\0" * (-len(bin_chunk) % 4)
              total_length = 12 + 8 + len(json_chunk) + 8 + len(bin_chunk)
              glb = bytearray(struct.pack("<4sII", b"glTF", 2, total_length))
              glb.extend(struct.pack("<I4s", len(json_chunk), b"JSON"))
              glb.extend(json_chunk)
              glb.extend(struct.pack("<I4s", len(bin_chunk), b"BIN\0"))
              glb.extend(bin_chunk)
              output.write_bytes(glb)
              print(f"wrote {output}: glb={len(glb)} bin={len(new_binary)}")

          repack(
              large_source,
              large_bytes,
              large_offsets,
              LARGE_OUT,
              overrides={8: {"values": large_detail_indices, "count": 252}},
          )
          repack(
              normal_source,
              normal_bytes,
              normal_offsets,
              NORMAL_OUT,
              overrides={
                  6: {"values": normal_detail_positions, "count": 62},
                  7: {"values": large_detail_colors, "count": 62},
                  8: {"values": large_detail_indices, "count": 252},
              },
          )

      - name: Validate GLB container structure
        run: python tools/check_glb_assets.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Khronos glTF validator
        run: npm install --no-save gltf-validator@2.0.0-dev.3.10

      - name: Require zero semantic glTF issues
        shell: bash
        run: |
          cat > validate-electro-gltf.cjs <<'NODE'
          const fs = require('fs');
          const validator = require('gltf-validator');
          (async () => {
            const files = [
              'assets/models/creatures/slime_electro/slime_electro.glb',
              'assets/models/creatures/slime_electro_large/slime_electro_large.glb',
            ];
            let failed = false;
            for (const file of files) {
              const report = await validator.validateBytes(new Uint8Array(fs.readFileSync(file)), {
                uri: file, format: 'glb', maxIssues: 0, writeTimestamp: false,
              });
              const errors = report.issues?.numErrors ?? 0;
              const warnings = report.issues?.numWarnings ?? 0;
              console.log(`${file}: errors=${errors} warnings=${warnings}`);
              if (errors || warnings) {
                console.log(JSON.stringify(report.issues?.messages ?? [], null, 2));
                failed = true;
              }
            }
            if (failed) process.exit(1);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node ./validate-electro-gltf.cjs

      - name: Commit repaired assets
        shell: bash
        run: |
          if git diff --quiet -- assets/models/creatures/slime_electro/slime_electro.glb assets/models/creatures/slime_electro_large/slime_electro_large.glb; then
            echo "No asset changes to commit"
            exit 0
          fi
          git config user.name "Sara Borges"
          git config user.email "sarakborges@outlook.com"
          git add assets/models/creatures/slime_electro/slime_electro.glb assets/models/creatures/slime_electro_large/slime_electro_large.glb
          git commit -m "Repair Electro GLB accessor layout"
          git pull --rebase origin develop
          git push origin HEAD:develop
