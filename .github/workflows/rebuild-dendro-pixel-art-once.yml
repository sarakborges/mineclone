name: Rebuild Dendro pixel art once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/rebuild-dendro-pixel-art-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install strict pixel-art Dendro generator
        env:
          GENERATOR_ZLIB_B64: >-
            
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          payload = os.environ['GENERATOR_ZLIB_B64'].replace('\n', '').replace(' ', '')
          target = Path('assets/models/creatures/slime_dendro/generate_slime_dendro.py')
          target.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY

      - name: Generate Dendro GLBs
        run: python assets/models/creatures/slime_dendro/generate_slime_dendro.py

      - name: Update Dendro metadata and version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          updates = {
              Path('assets/models/creatures/slime_dendro/slime_dendro.collider.json'): {
                  'size': [1.2105, 1.51, 1.146],
                  'center': [-0.00525, 0.75, -0.003],
                  'height': 1.51,
                  'construction': 'clean pale-green slime_blob body + strict pixel-art stepped sprout/fern crown + square-hook tendril + square texture-driven face',
              },
              Path('assets/models/creatures/slime_dendro_large/slime_dendro_large.collider.json'): {
                  'size': [2.72, 2.2015, 1.848],
                  'center': [0.0, 0.99925, 0.004],
                  'height': 2.2015,
                  'construction': 'clean pale-green slime_blob body + strict pixel-art stepped orange flower + voxel bud + fern/square-hook collar + square texture-driven face',
              },
          }
          for path, values in updates.items():
              data = json.loads(path.read_text())
              data['model_bounds_rest']['size'] = values['size']
              data['model_bounds_rest']['center'] = values['center']
              data['model_bounds_rest']['approximate_visual_height'] = values['height']
              data['authoring']['construction'] = values['construction']
              data['authoring']['pixel_art_geometry'] = 'axis-aligned boxes and orthogonal stepped paths only; no smooth curves or straight diagonal detail geometry'
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          Path('VERSION').write_text('0.68.52\n')
          handoff = Path('HANDOFF.md')
          text = handoff.read_text()
          section = '''\n## 2026-09-30 — 0.68.52 Dendro strict pixel-art geometry\n\n- Dendro normal + large tiveram todos os detalhes vegetais refeitos como pixel art geométrica estrita.\n- Folhas, frondes, caules, gavinhas, pétalas, sépalas e botão usam apenas caixas axis-aligned e caminhos ortogonais em degraus; não há curvas suaves nem prismas diagonais.\n- Diagonais visuais são staircases de voxels; a gavinha agora é um hook/espiral quadrada.\n- A flor large mantém pétalas laranja em camadas, mas cada lóbulo é um conjunto de terraços voxelados.\n- Auditoria adicional valida que todas as normals dos GLBs são cardinais. Face 64x64 e seis clips de animação permanecem.\n\nVERSION: `0.68.52`.\n'''
          if '## 2026-09-30 — 0.68.52 Dendro strict pixel-art geometry' not in text:
              pos = text.find('\n## ')
              text = text[:pos] + section + text[pos:]
          text = text.replace('versão de conteúdo atual `0.68.51`', 'versão de conteúdo atual `0.68.52`', 1)
          text = text.replace('`VERSION` em `0.68.51`', '`VERSION` em `0.68.52`', 1)
          handoff.write_text(text)
          PY

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Enforce cardinal-only Dendro detail geometry
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          def normals(path):
              raw = path.read_bytes()
              magic, version, total = struct.unpack_from('<4sII', raw, 0)
              assert magic == b'glTF' and version == 2 and total == len(raw)
              json_len, json_type = struct.unpack_from('<I4s', raw, 12)
              assert json_type == b'JSON'
              doc = json.loads(raw[20:20 + json_len].decode('utf-8'))
              bin_header = 20 + json_len
              bin_len, bin_type = struct.unpack_from('<I4s', raw, bin_header)
              assert bin_type == b'BIN\0'
              binary = raw[bin_header + 8:bin_header + 8 + bin_len]
              for mesh in doc.get('meshes', []):
                  for prim in mesh.get('primitives', []):
                      ai = prim.get('attributes', {}).get('NORMAL')
                      if ai is None:
                          continue
                      acc = doc['accessors'][ai]
                      assert acc['componentType'] == 5126 and acc['type'] == 'VEC3'
                      view = doc['bufferViews'][acc['bufferView']]
                      stride = view.get('byteStride', 12)
                      start = view.get('byteOffset', 0) + acc.get('byteOffset', 0)
                      for i in range(acc['count']):
                          n = struct.unpack_from('<fff', binary, start + i * stride)
                          nz = [abs(v) > 1e-5 for v in n]
                          assert sum(nz) == 1, (path, mesh.get('name'), n)
                          assert any(abs(abs(v) - 1.0) < 1e-5 for v in n), (path, n)
              assert doc.get('extras', {}).get('pixel_art_geometry') is True

          for path in (
              Path('assets/models/creatures/slime_dendro/slime_dendro.glb'),
              Path('assets/models/creatures/slime_dendro_large/slime_dendro_large.glb'),
          ):
              normals(path)
              print('cardinal geometry OK:', path)
          PY

      - name: Commit rebuilt Dendro assets and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-dendro-pixel-art-once.yml
          git add VERSION HANDOFF.md \
            assets/models/creatures/slime_dendro/generate_slime_dendro.py \
            assets/models/creatures/slime_dendro/slime_dendro.glb \
            assets/models/creatures/slime_dendro/slime_dendro.collider.json \
            assets/models/creatures/slime_dendro_large/slime_dendro_large.glb \
            assets/models/creatures/slime_dendro_large/slime_dendro_large.collider.json
          git commit -m "Rebuild Dendro slime details as strict pixel art"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
