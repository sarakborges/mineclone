name: Generate Dendro slime GLBs

on:
  push:
    branches:
      - develop
    paths:
      - assets/models/creatures/slime_dendro/generate_slime_dendro.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Dendro slime models
        run: python assets/models/creatures/slime_dendro/generate_slime_dendro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Commit generated binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/slime_dendro/slime_dendro.glb
          git add assets/models/creatures/slime_dendro_large/slime_dendro_large.glb
          if git diff --cached --quiet; then
            echo "Generated GLBs already match."
            exit 0
          fi
          git commit -m "Regenerate Dendro slime models"
          git push origin HEAD:develop
