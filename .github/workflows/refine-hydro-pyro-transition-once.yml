name: Refine Hydro Pyro transition once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/refine-hydro-pyro-transition-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refine Hydro and Pyro generators
        run: python tools/refine_hydro_pyro_transition_once.py

      - name: Generate Hydro and Pyro GLBs
        run: |
          python assets/models/creatures/slime_hydro/generate_slime_hydro.py
          python assets/models/creatures/slime_pyro/generate_slime_pyro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Audit feature geometry and root materials
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          def load(path):
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              return doc, binary

          def cardinal_audit(path, mesh_name):
              doc, binary = load(path)
              mesh = next(m for m in doc['meshes'] if m['name'] == mesh_name)
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset',0) + a.get('byteOffset',0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base+i*12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal normals in {mesh_name}')
              return doc, mesh

          hydro_paths = [
              Path('assets/models/creatures/slime_hydro/slime_hydro.glb'),
              Path('assets/models/creatures/slime_hydro_large/slime_hydro_large.glb'),
          ]
          for path in hydro_paths:
              doc, mesh = cardinal_audit(path, 'hydro_water_droplet')
              mats = {p['material'] for p in mesh['primitives']}
              if 5 not in mats:
                  raise SystemExit(f'{path}: Hydro droplet root/top material 5 missing')
              if len(mats) < 4:
                  raise SystemExit(f'{path}: Hydro droplet still too flat; only {len(mats)} materials')
              print(path, 'Hydro continuation OK, materials=', sorted(mats))

          pyro_paths = [
              Path('assets/models/creatures/slime_pyro/slime_pyro.glb'),
              Path('assets/models/creatures/slime_pyro_large/slime_pyro_large.glb'),
          ]
          for path in pyro_paths:
              doc, mesh = cardinal_audit(path, 'pyro_flame_tuft')
              mats = {p['material'] for p in mesh['primitives']}
              if 5 not in mats:
                  raise SystemExit(f'{path}: Pyro flame root material does not match top material')
              print(path, 'Pyro flame root transition OK, materials=', sorted(mats))
          PY

      - name: Commit refined models
        shell: bash
        run: |
          rm -f .github/workflows/refine-hydro-pyro-transition-once.yml
          rm -f tools/refine_hydro_pyro_transition_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blend Hydro droplet and Pyro flames into slime tops"
          git push origin develop
