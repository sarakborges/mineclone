name: Rebuild Cryo ice shell once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-cryo-ice-shell-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Cryo generator from current slime infrastructure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('assets/models/creatures/slime_geo/generate_slime_geo.py')
          dst = Path('assets/models/creatures/slime_cryo/generate_slime_cryo.py')
          text = src.read_text()

          doc_end = text.index('from __future__ import annotations')
          text = '''#!/usr/bin/env python3\n"""Generate pixel-art Cryo Slime models from the rounded slime_blob body language.\n\nThe lower body remains a clean cyan slime blob while an integrated crystalline\nice shell wraps the upper head around the eyes. A tall central crystal dominates\nthe silhouette, with outward-leaning side spikes and smaller shards, all built\nfrom axis-aligned voxel stair-steps rather than rotated or smooth geometry.\n"""\n''' + text[doc_end:]

          p0 = text.index('PALETTE = (')
          p1 = text.index('\n\n\ndef lin', p0)
          palette = '''PALETTE = (\n    ("SlimeShell", (0.30, 0.72, 0.92)),\n    ("SlimeShellCenter", (0.43, 0.82, 0.98)),\n    ("SlimeShellOuter", (0.22, 0.62, 0.84)),\n    ("SlimeShellBottom", (0.38, 0.79, 0.95)),\n    ("SlimeShellTop", (0.48, 0.84, 0.98)),\n    ("SlimeShellLight", (0.61, 0.89, 1.00)),\n    ("SlimeShellBright", (0.75, 0.95, 1.00)),\n    ("ElementAccent", (0.30, 0.66, 0.91)),\n    ("ElementPale", (0.56, 0.86, 1.00)),\n    ("ElementDark", (0.18, 0.50, 0.78)),\n    ("ElementWhite", (0.82, 0.96, 1.00)),\n)'''
          text = text[:p0] + palette + text[p1:]

          b0 = text.index('    def body_material(')
          b1 = text.index('    def bucket():', b0)
          body = '''    def body_material(ix: int, iy: int, iz: int, normal) -> int:\n        gx = (ix - cx_mid) / (NX * 0.5)\n        gy = iy / (NY - 1)\n        gz = (iz - cz_mid) / (NZ * 0.5)\n\n        # Integrated icy shell: the upper head itself becomes crystalline rather\n        # than wearing a detached ring of shards. Boundary stays pixel-stepped.\n        shell_front = (\n            gy >= 0.63\n            or (gy >= 0.54 and abs(gx) >= 0.40)\n            or (gy >= 0.48 and abs(gx) >= 0.62)\n            or (gy >= 0.52 and abs(gx) <= 0.18)\n        )\n        shell_side = gy >= 0.56 or (gy >= 0.47 and abs(gz) <= 0.44)\n        shell_back = gy >= 0.55\n\n        if normal == (0, 0, -1):\n            if shell_front:\n                if gy >= 0.81:\n                    return 10\n                if abs(gx) >= 0.66:\n                    return 7\n                if ((ix + iy) % 4) == 0:\n                    return 8\n                return 10 if ((ix + iy) % 5) == 0 else 7\n            if gy < 0.16:\n                return 3\n            if abs(gx) > 0.73:\n                return 2\n            if abs(gx) < 0.58 and 0.16 < gy < 0.48:\n                return 1\n            return 0\n        if normal == (0, 1, 0):\n            return 10 if gy > 0.65 else 8\n        if normal == (0, -1, 0):\n            return 3\n        if normal in ((1, 0, 0), (-1, 0, 0)):\n            if shell_side:\n                return 8 if gy < 0.76 else 10\n            return 2 if normal == (1, 0, 0) else 0\n        if normal == (0, 0, 1):\n            if shell_back:\n                return 7 if gy < 0.78 else 10\n            return 2 if abs(gx) > 0.66 or abs(gz) > 0.66 else 0\n        return 0\n\n'''
          text = text[:b0] + body + text[b1:]

          text = text.replace('"geo_blob_body"', '"cryo_blob_body"')

          d0 = text.index('    s = body_width / 1.20')
          d1 = text.index('    details_prims = [', d0)
          details = '''    s = body_width / 1.20\n    ice_dark = bucket()\n    ice_mid = bucket()\n    ice_light = bucket()\n    top = body_height * 0.5\n\n    def ice_step(bucket_, x, y, z, w, h, d):\n        add_box(bucket_, (x * s, top + y * s, z * s), (w * s, h * s, d * s))\n\n    # Crystalline protrusions are fused into the upper shell. Apparent diagonals\n    # are produced only by progressively offset, narrowing axis-aligned boxes.\n    if not large:\n        # Dominant central crystal: broad embedded root -> sharp stepped apex.\n        for x, y, z, w, h, d, mat in [\n            ( 0.00, -0.150, -0.010, 0.38, 0.24, 0.34, ice_dark),\n            ( 0.00, -0.005, -0.005, 0.32, 0.19, 0.29, ice_mid),\n            ( 0.00,  0.120,  0.000, 0.26, 0.15, 0.24, ice_light),\n            ( 0.00,  0.225,  0.005, 0.20, 0.12, 0.19, ice_mid),\n            ( 0.00,  0.315,  0.010, 0.14, 0.09, 0.14, ice_light),\n            ( 0.00,  0.380,  0.015, 0.08, 0.06, 0.09, ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n\n        # Left side shard, diagonally leaning outward in voxel stairs.\n        for x, y, z, w, h, d, mat in [\n            (-0.39, -0.130, -0.035, 0.30, 0.23, 0.28, ice_dark),\n            (-0.47, -0.015, -0.025, 0.25, 0.18, 0.23, ice_mid),\n            (-0.55,  0.080, -0.015, 0.20, 0.14, 0.19, ice_light),\n            (-0.62,  0.155, -0.005, 0.15, 0.10, 0.15, ice_mid),\n            (-0.68,  0.210,  0.005, 0.09, 0.07, 0.10, ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n\n        # Right shard uses a different staircase rhythm to avoid mirror symmetry.\n        for x, y, z, w, h, d, mat in [\n            ( 0.37, -0.145, -0.050, 0.31, 0.22, 0.29, ice_dark),\n            ( 0.45, -0.035, -0.040, 0.25, 0.17, 0.24, ice_mid),\n            ( 0.53,  0.052, -0.030, 0.19, 0.13, 0.19, ice_light),\n            ( 0.60,  0.120, -0.020, 0.14, 0.09, 0.14, ice_mid),\n            ( 0.65,  0.170, -0.010, 0.08, 0.06, 0.09, ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n\n        # Smaller crown shards emerging from the shell around the main crystal.\n        for x, y, z, w, h, d, mat in [\n            (-0.245, -0.055, -0.090, 0.18, 0.17, 0.20, ice_mid),\n            (-0.285,  0.055, -0.080, 0.12, 0.11, 0.15, ice_light),\n            ( 0.250, -0.070, -0.100, 0.17, 0.16, 0.19, ice_dark),\n            ( 0.285,  0.030, -0.090, 0.11, 0.10, 0.14, ice_light),\n            (-0.150, -0.020,  0.135, 0.13, 0.12, 0.15, ice_mid),\n            ( 0.170, -0.035,  0.145, 0.12, 0.11, 0.14, ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n        detail_height = 0.43 * s\n        detail_width = 1.46 * s\n    else:\n        for x, y, z, w, h, d, mat in [\n            (0.00, -0.175, -0.010, 0.42, 0.27, 0.37, ice_dark),\n            (0.00, -0.015, -0.005, 0.35, 0.21, 0.31, ice_mid),\n            (0.00,  0.120,  0.000, 0.28, 0.17, 0.26, ice_light),\n            (0.00,  0.235,  0.006, 0.22, 0.13, 0.21, ice_mid),\n            (0.00,  0.325,  0.012, 0.16, 0.10, 0.16, ice_light),\n            (0.00,  0.395,  0.018, 0.10, 0.07, 0.11, ice_light),\n            (0.00,  0.445,  0.022, 0.055,0.045,0.065,ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n\n        for x, y, z, w, h, d, mat in [\n            (-0.41,-0.155,-0.040,0.34,0.25,0.31,ice_dark),\n            (-0.50,-0.025,-0.030,0.28,0.19,0.26,ice_mid),\n            (-0.59, 0.080,-0.020,0.22,0.15,0.21,ice_light),\n            (-0.67, 0.165,-0.010,0.16,0.11,0.16,ice_mid),\n            (-0.73, 0.225, 0.000,0.095,0.075,0.11,ice_light),\n            ( 0.39,-0.170,-0.055,0.35,0.24,0.32,ice_dark),\n            ( 0.48,-0.045,-0.045,0.28,0.19,0.26,ice_mid),\n            ( 0.57, 0.055,-0.035,0.21,0.14,0.21,ice_light),\n            ( 0.65, 0.135,-0.025,0.15,0.10,0.15,ice_mid),\n            ( 0.71, 0.192,-0.015,0.09,0.07,0.10,ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n\n        for x, y, z, w, h, d, mat in [\n            (-0.26,-0.070,-0.105,0.20,0.19,0.22,ice_mid),\n            (-0.30, 0.050,-0.095,0.13,0.12,0.16,ice_light),\n            ( 0.27,-0.085,-0.115,0.19,0.18,0.21,ice_dark),\n            ( 0.31, 0.025,-0.105,0.12,0.11,0.15,ice_light),\n            (-0.17,-0.030, 0.145,0.14,0.13,0.16,ice_mid),\n            ( 0.19,-0.045, 0.155,0.13,0.12,0.15,ice_light),\n        ]:\n            ice_step(mat, x, y, z, w, h, d)\n        detail_height = 0.49 * s\n        detail_width = 1.54 * s\n\n'''
          text = text[:d0] + details + text[d1:]

          text = text.replace('prim(rock_dark, 9)', 'prim(ice_dark, 9)')
          text = text.replace('prim(rock_mid, 7)', 'prim(ice_mid, 7)')
          text = text.replace('prim(rock_light, 8)', 'prim(ice_light, 8)')
          text = text.replace('"geo_rock_shell_protrusions"', '"cryo_ice_shell_spikes"')
          text = text.replace('details_node = node("GeoRockShell", mesh=details_mesh)', 'details_node = node("CryoIceShell", mesh=details_mesh)')
          text = text.replace('"GeoSlime"', '"CryoSlime"')
          text = text.replace('Asteria Geo integrated rock shell rebuild v2', 'Asteria Cryo integrated ice shell rebuild v1')
          text = text.replace('"face_source": "textures/creatures/slime_geo/face.png"', '"face_source": "textures/creatures/slime_cryo/face.png"')
          text = text.replace('"asset_id": f"asteria:{asset_id}"', '"asset_id": f"asteria:{asset_id}"')
          text = text.replace('"pixel_art_geometry": "all Geo rock-shell faces are axis-aligned; outward diagonal peaks are represented by voxel staircases"', '"pixel_art_geometry": "all Cryo ice-shell faces are axis-aligned; central and outward diagonal spikes taper through voxel staircases"')
          text = text.replace('"reference_design": "pale lower blob; dark rocky upper shell around eyes; two outward-leaning stepped side peaks"', '"reference_design": "cyan lower blob; integrated icy upper shell; tall sharp central crystal; outward-leaning side spikes and smaller shards"')

          # Cryo collider differs slightly for the large variant.
          text = text.replace('collider_size = [1.287, 1.1928, 1.2784]\n        collider_y = 0.5964', 'collider_size = [1.248, 1.2012, 1.2376]\n        collider_y = 0.6006')

          m0 = text.index('def main() -> None:')
          text = text[:m0] + '''def main() -> None:\n    small = generate("slime_cryo", ROOT / "slime_cryo.glb", 1.20, 1.00, 1.14, False)\n    large_dir = ROOT.parent / "slime_cryo_large"\n    large = generate("slime_cryo_large", large_dir / "slime_cryo_large.glb", 1.92, 1.43, 1.82, True)\n    print("small", small)\n    print("large", large)\n\n\nif __name__ == "__main__":\n    main()\n'''

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text)
          PY

      - name: Generate Cryo GLBs
        run: python assets/models/creatures/slime_cryo/generate_slime_cryo.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Enforce Cryo pixel-art geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          paths = [
              Path('assets/models/creatures/slime_cryo/slime_cryo.glb'),
              Path('assets/models/creatures/slime_cryo_large/slime_cryo_large.glb'),
          ]
          for path in paths:
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              mesh = next(m for m in doc['meshes'] if m['name'] == 'cryo_ice_shell_spikes')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset', 0) + a.get('byteOffset', 0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base + i * 12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal normals')
              print(path, 'Cryo pixel-art normals OK')
          PY

      - name: Update Cryo metadata and version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('assets/models/creatures/slime_cryo/slime_cryo.collider.json'),
              Path('assets/models/creatures/slime_cryo_large/slime_cryo_large.collider.json'),
          ]:
              d = json.loads(path.read_text())
              d['authoring']['construction'] = 'cyan slime_blob lower body + integrated crystalline upper shell around the eyes + tall central voxel crystal + outward-leaning stepped side spikes + smaller shards + square texture-driven face'
              d['authoring']['reference'] = 'user Cryo reference: integrated ice shell with a dominant sharp central crystal and multiple outward spikes; all apparent diagonals are pixel-art staircases'
              path.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          Path('VERSION').write_text('0.68.56\n')
          h = Path('HANDOFF.md')
          if h.exists():
              t = h.read_text()
              note = '\n- 0.68.56: Cryo Slime rebuilt from the supplied reference: integrated icy upper shell, tall central stepped crystal, outward diagonal voxel spikes, and smaller shards; normal + large regenerated with cardinal-only geometry.\n'
              if '0.68.56: Cryo Slime rebuilt' not in t:
                  h.write_text(t.rstrip() + note)
          PY

      - name: Commit rebuilt Cryo assets and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rebuild-cryo-ice-shell-once.yml
          git add assets/models/creatures/slime_cryo assets/models/creatures/slime_cryo_large VERSION HANDOFF.md .github/workflows/rebuild-cryo-ice-shell-once.yml
          git commit -m "Rebuild Cryo slime as sharp pixel-art ice shell"
          git push origin HEAD:develop
