name: Split data localization

on:
  push:
    branches:
      - develop
    paths:
      - tools/migrate_data_localization.py
      - .github/workflows/migrate-data-localization.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Split localization and update loader
        run: python3 tools/migrate_data_localization.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/migrate_data_localization.py .github/workflows/migrate-data-localization.yml
          git add src tools/check_localizations.py data
          git diff --cached --quiet && exit 0
          git commit -m "refactor: split data localization catalogs"
          git push origin HEAD:develop
