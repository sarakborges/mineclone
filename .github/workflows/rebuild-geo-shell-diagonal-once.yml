name: Rebuild Geo integrated shell once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-geo-shell-diagonal-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate Geo rock shell and diagonal side peaks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/models/creatures/slime_geo/generate_slime_geo.py')
          text = p.read_text()

          text = text.replace(
              'The body remains a clean stone-grey blob. Geo identity is concentrated in an\naxis-aligned stepped stone crown: two taller outer horn-like spires plus smaller\ncentral rocks. No rotated prisms, curved geometry, or smooth diagonal faces are\nused. The face remains a square texture-driven SlimeFace decal.',
              'The lower body stays pale stone-grey while the upper half becomes an integrated\ndark rocky shell around the eyes. Two outer rock peaks grow from that shell and\nlean outward through voxel stair-steps. No rotated prisms or smooth diagonal\nfaces are used; every apparent diagonal is pixel-art stepping. The face remains\na square texture-driven SlimeFace decal.'
          )

          old_body = '''    def body_material(ix: int, iy: int, iz: int, normal) -> int:\n        gx = (ix - cx_mid) / (NX * 0.5)\n        gy = iy / (NY - 1)\n        gz = (iz - cz_mid) / (NZ * 0.5)\n        if normal == (0, 0, -1):\n            if gy < 0.18:\n                return 3\n            if abs(gx) > 0.73:\n                return 2\n            if gy > 0.80:\n                return 4\n            if abs(gx) < 0.58 and 0.18 < gy < 0.70:\n                return 1\n            return 0\n        if normal == (0, 1, 0):\n            return 5 if gy > 0.72 else 4\n        if normal == (0, -1, 0):\n            return 3\n        if normal == (1, 0, 0):\n            return 2\n        if normal == (-1, 0, 0):\n            return 4 if gy > 0.62 else 0\n        if normal == (0, 0, 1):\n            return 2 if abs(gx) > 0.66 or abs(gz) > 0.66 else 0\n        return 0\n'''
          new_body = '''    def body_material(ix: int, iy: int, iz: int, normal) -> int:\n        gx = (ix - cx_mid) / (NX * 0.5)\n        gy = iy / (NY - 1)\n        gz = (iz - cz_mid) / (NZ * 0.5)\n\n        # The reference is not a clean blob wearing rocks: the upper half itself\n        # is a dark rocky shell. The boundary is deliberately blocky and uneven.\n        shell_front = (\n            gy >= 0.60\n            or (gy >= 0.49 and abs(gx) >= 0.42)\n            or (gy >= 0.43 and abs(gx) >= 0.60)\n            or (gy >= 0.47 and abs(gx) <= 0.19)\n        )\n        shell_side = gy >= 0.52 or (gy >= 0.42 and abs(gz) <= 0.46)\n        shell_back = gy >= 0.50\n\n        if normal == (0, 0, -1):\n            if shell_front:\n                if gy >= 0.78 or abs(gx) >= 0.67:\n                    return 9\n                if ((ix + iy) % 5) == 0:\n                    return 10\n                return 7 if ((ix + iy) % 3) else 8\n            if gy < 0.18:\n                return 3\n            if abs(gx) > 0.73:\n                return 2\n            if abs(gx) < 0.58 and 0.18 < gy < 0.43:\n                return 1\n            return 0\n        if normal == (0, 1, 0):\n            return 9 if gy > 0.62 else 7\n        if normal == (0, -1, 0):\n            return 3\n        if normal in ((1, 0, 0), (-1, 0, 0)):\n            if shell_side:\n                return 9 if gy > 0.72 else 7\n            return 2 if normal == (1, 0, 0) else 0\n        if normal == (0, 0, 1):\n            if shell_back:\n                return 9 if gy > 0.72 else 7\n            return 2 if abs(gx) > 0.66 or abs(gz) > 0.66 else 0\n        return 0\n'''
          if old_body not in text:
              raise SystemExit('body_material block not found')
          text = text.replace(old_body, new_body)
          text = text.replace('body_buckets = [bucket() for _ in range(7)]', 'body_buckets = [bucket() for _ in range(len(PALETTE))]')

          start = text.index('    # Irregular rock cap grown into the slime body.')
          end = text.index('    details_prims = [', start)
          replacement = '''    # Protrusions grow out of the integrated shell. They are not a crown and\n    # there is no connecting band. Side peaks lean OUTWARD through voxel stairs.\n    if not large:\n        # Left peak: broad temple root, then progressively higher + farther left.\n        for x, y, z, w, h, d, mat in [\n            (-0.40, -0.115, -0.045, 0.34, 0.28, 0.31, rock_dark),\n            (-0.46,  0.020, -0.035, 0.29, 0.20, 0.28, rock_mid),\n            (-0.53,  0.130, -0.025, 0.23, 0.16, 0.24, rock_dark),\n            (-0.59,  0.225, -0.015, 0.18, 0.13, 0.20, rock_mid),\n            (-0.64,  0.305, -0.005, 0.13, 0.10, 0.16, rock_light),\n        ]:\n            rock_step(mat, x, y, z, w, h, d)\n\n        # Right peak: same outward-sloping language, intentionally different rhythm.\n        for x, y, z, w, h, d, mat in [\n            (0.37, -0.135, -0.070, 0.36, 0.27, 0.32, rock_dark),\n            (0.43, -0.005, -0.055, 0.30, 0.20, 0.28, rock_mid),\n            (0.49,  0.100, -0.042, 0.24, 0.16, 0.24, rock_dark),\n            (0.55,  0.188, -0.030, 0.18, 0.12, 0.20, rock_mid),\n            (0.59,  0.258, -0.020, 0.12, 0.08, 0.15, rock_light),\n        ]:\n            rock_step(mat, x, y, z, w, h, d)\n\n        # Forehead plates sit low and merge into the rocky mask around the eyes.\n        rock_step(rock_dark,   0.010, -0.150, -0.185, 0.34, 0.25, 0.25)\n        rock_step(rock_mid,    0.025, -0.020, -0.190, 0.27, 0.17, 0.21)\n        rock_step(rock_light, -0.010,  0.075, -0.185, 0.17, 0.09, 0.17)\n\n        # Irregular fillers bridging the shell visually, but never forming a band.\n        for x, y, z, w, h, d, mat in [\n            (-0.23, -0.070, -0.105, 0.22, 0.20, 0.24, rock_mid),\n            ( 0.24, -0.095, -0.120, 0.20, 0.19, 0.23, rock_dark),\n            (-0.18,  0.105,  0.030, 0.15, 0.13, 0.16, rock_dark),\n            ( 0.20,  0.080,  0.045, 0.14, 0.12, 0.15, rock_mid),\n        ]:\n            rock_step(mat, x, y, z, w, h, d)\n        detail_height = 0.38 * s\n        detail_width = 1.34 * s\n    else:\n        for x, y, z, w, h, d, mat in [\n            (-0.42, -0.145, -0.050, 0.38, 0.31, 0.34, rock_dark),\n            (-0.49,  0.000, -0.040, 0.33, 0.23, 0.31, rock_mid),\n            (-0.57,  0.125, -0.028, 0.27, 0.19, 0.27, rock_dark),\n            (-0.64,  0.235, -0.016, 0.21, 0.15, 0.23, rock_mid),\n            (-0.70,  0.325, -0.005, 0.15, 0.11, 0.18, rock_light),\n            ( 0.39, -0.160, -0.075, 0.40, 0.30, 0.35, rock_dark),\n            ( 0.46, -0.020, -0.060, 0.34, 0.22, 0.31, rock_mid),\n            ( 0.53,  0.098, -0.045, 0.28, 0.18, 0.27, rock_dark),\n            ( 0.60,  0.198, -0.032, 0.21, 0.14, 0.22, rock_mid),\n            ( 0.65,  0.278, -0.020, 0.14, 0.10, 0.17, rock_light),\n        ]:\n            rock_step(mat, x, y, z, w, h, d)\n\n        rock_step(rock_dark,  0.015, -0.175, -0.205, 0.38, 0.28, 0.28)\n        rock_step(rock_mid,   0.030, -0.025, -0.212, 0.30, 0.19, 0.23)\n        rock_step(rock_light,-0.015,  0.080, -0.205, 0.19, 0.10, 0.18)\n        for x, y, z, w, h, d, mat in [\n            (-0.25, -0.090, -0.120, 0.24, 0.22, 0.25, rock_mid),\n            ( 0.26, -0.115, -0.135, 0.22, 0.20, 0.24, rock_dark),\n            (-0.20,  0.115,  0.035, 0.17, 0.14, 0.17, rock_dark),\n            ( 0.22,  0.090,  0.050, 0.16, 0.13, 0.16, rock_mid),\n        ]:\n            rock_step(mat, x, y, z, w, h, d)\n        detail_height = 0.41 * s\n        detail_width = 1.46 * s\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('"geo_stone_crown"', '"geo_rock_shell_protrusions"')
          text = text.replace('details_node = node("GeoCrown", mesh=details_mesh)', 'details_node = node("GeoRockShell", mesh=details_mesh)')
          text = text.replace('"Asteria Geo slime stone crown rebuild v1"', '"Asteria Geo integrated rock shell rebuild v2"')
          text = text.replace('"pixel_art_geometry": "all Geo crown faces are axis-aligned; tapered stone silhouettes use box staircases"', '"pixel_art_geometry": "all Geo rock-shell faces are axis-aligned; outward diagonal peaks are represented by voxel staircases"')
          text = text.replace('"reference_design": "clean grey blob with a dark stone crown and two taller outer horn-like spires"', '"reference_design": "pale lower blob; dark rocky upper shell around eyes; two outward-leaning stepped side peaks"')
          p.write_text(text)
          PY

      - name: Generate Geo GLBs
        run: python assets/models/creatures/slime_geo/generate_slime_geo.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Enforce Geo pixel-art geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          for path in [Path('assets/models/creatures/slime_geo/slime_geo.glb'), Path('assets/models/creatures/slime_geo_large/slime_geo_large.glb')]:
              b = path.read_bytes(); off = 12
              jl, jt = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, bt = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              mesh = next(m for m in doc['meshes'] if m['name'] == 'geo_rock_shell_protrusions')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset',0) + a.get('byteOffset',0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base+i*12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal normals')
              print(path, 'pixel-art normals OK')
          PY

      - name: Update Geo metadata and version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('assets/models/creatures/slime_geo/slime_geo.collider.json'), Path('assets/models/creatures/slime_geo_large/slime_geo_large.collider.json')]:
              d=json.loads(path.read_text())
              d['authoring']['construction']='pale slime_blob lower body + integrated dark rocky upper shell around the eyes + outward-leaning voxel-stair side peaks + square texture-driven face'
              d['authoring']['reference']='user Geo reference: rocky shell covers the upper head; side peaks lean outward rather than standing vertically'
              path.write_text(json.dumps(d, indent=2, ensure_ascii=False)+'\n')
          Path('VERSION').write_text('0.68.55\n')
          h=Path('HANDOFF.md')
          t=h.read_text()
          note='''## 2026-09-30 — 0.68.55 Geo integrated shell correction\n\n- Geo reference reread: dark stone is an integrated shell covering the upper half of the head and surrounding the eyes, not a crown/accessory above the blob.\n- Side stone peaks lean outward through voxel stair-steps; no smooth/rotated diagonal geometry.\n- Lower half remains pale and clean; forehead/temple stone masses are partially embedded in the blob.\n- Geo normal + large regenerated; GLB audit + cardinal-normal audit passed.\n\nVERSION: `0.68.55`.\n\n'''
          if '0.68.55 Geo integrated shell correction' not in t:
              insert=t.find('## Estado atual')
              t=t[:insert]+note+t[insert:]
          h.write_text(t)
          PY

      - name: Commit rebuilt Geo assets and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rebuild-geo-shell-diagonal-once.yml
          git add assets/models/creatures/slime_geo/generate_slime_geo.py \
                  assets/models/creatures/slime_geo/slime_geo.glb \
                  assets/models/creatures/slime_geo/slime_geo.collider.json \
                  assets/models/creatures/slime_geo_large/slime_geo_large.glb \
                  assets/models/creatures/slime_geo_large/slime_geo_large.collider.json \
                  VERSION HANDOFF.md .github/workflows/rebuild-geo-shell-diagonal-once.yml
          git commit -m "Match Geo slime rocky shell reference"
          git push origin HEAD:develop
