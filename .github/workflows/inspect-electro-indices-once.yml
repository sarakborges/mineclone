name: Inspect Electro indices once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/inspect-electro-indices-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inspect historical index regions
        shell: python
        run: |
          import base64, json, struct, subprocess
          ref = "35b8aaca906e1fdf48bae56feb4bb94b84814861"
          cases = [
              ("normal", "assets/models/creatures/slime_electro/slime_electro.gltf", 7180, 240, 54),
              ("large252", "assets/models/creatures/slime_electro_large/slime_electro_large.gltf", 4732, 252, 62),
              ("large276", "assets/models/creatures/slime_electro_large/slime_electro_large.gltf", 4732, 276, 62),
          ]
          for name, path, offset, count, vertices in cases:
              doc = json.loads(subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True))
              buf = base64.b64decode(doc["buffers"][0]["uri"].split(",", 1)[1])
              values = struct.unpack_from("<" + "H" * count, buf, offset)
              invalid = [(i, value) for i, value in enumerate(values) if value >= vertices]
              degenerate = [i // 3 for i in range(0, len(values) - 2, 3) if len(set(values[i:i+3])) < 3]
              print(f"{name}: count={count} vertices={vertices} min={min(values)} max={max(values)} unique={len(set(values))} invalid={len(invalid)} degenerate={len(degenerate)}")
              print(f"{name}: first_invalid={invalid[:24]}")
              print(f"{name}: tail={values[-36:]}")
