name: Validate Electro glTF once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/validate-electro-gltf-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Analyze historical Electro buffers
        shell: python
        run: |
          import base64
          import json
          import math
          import struct
          import subprocess

          SOURCE_REF = "35b8aaca906e1fdf48bae56feb4bb94b84814861"
          SOURCES = [
              "assets/models/creatures/slime_electro/slime_electro.gltf",
              "assets/models/creatures/slime_electro_large/slime_electro_large.gltf",
          ]
          WIDTH = {"SCALAR": 1, "VEC2": 2, "VEC3": 3, "VEC4": 4}
          SIZE = {5123: 2, 5126: 4}
          FMT = {5123: "H", 5126: "f"}

          def decode_buffer(doc):
              uri = doc["buffers"][0]["uri"]
              return base64.b64decode(uri.split(",", 1)[1])

          def unpack_at(buf, offset, accessor):
              width = WIDTH[accessor["type"]]
              count = accessor["count"]
              component = accessor["componentType"]
              fmt = "<" + FMT[component] * (width * count)
              size = struct.calcsize(fmt)
              if offset + size > len(buf):
                  return None
              return struct.unpack_from(fmt, buf, offset)

          def close(a, b, tol=2e-5):
              return abs(float(a) - float(b)) <= tol * max(1.0, abs(float(b)))

          def vector_bounds(values, width):
              rows = [values[i:i+width] for i in range(0, len(values), width)]
              return ([min(row[j] for row in rows) for j in range(width)],
                      [max(row[j] for row in rows) for j in range(width)])

          for path in SOURCES:
              source = subprocess.check_output(["git", "show", f"{SOURCE_REF}:{path}"], text=True)
              doc = json.loads(source)
              buf = decode_buffer(doc)
              print(f"=== {path} decoded={len(buf)} declared={doc['buffers'][0]['byteLength']} ===")
              primitive_index_map = {}
              for mesh_i, mesh in enumerate(doc.get("meshes", [])):
                  for prim_i, prim in enumerate(mesh.get("primitives", [])):
                      idx = prim.get("indices")
                      pos = prim.get("attributes", {}).get("POSITION")
                      if idx is not None and pos is not None:
                          primitive_index_map[idx] = (mesh_i, prim_i, doc["accessors"][pos]["count"])

              animation_inputs = set()
              animation_outputs = set()
              for animation in doc.get("animations", []):
                  for sampler in animation.get("samplers", []):
                      animation_inputs.add(sampler["input"])
                      animation_outputs.add(sampler["output"])

              for index, accessor in enumerate(doc.get("accessors", [])):
                  view = doc["bufferViews"][accessor["bufferView"]]
                  declared = view.get("byteOffset", 0) + accessor.get("byteOffset", 0)
                  component = accessor["componentType"]
                  align = SIZE.get(component, 1)
                  candidates = []
                  for offset in range(0, len(buf), align):
                      values = unpack_at(buf, offset, accessor)
                      if values is None:
                          break
                      ok = True
                      score = 0
                      if index in primitive_index_map:
                          _, _, vertex_count = primitive_index_map[index]
                          ok = all(0 <= value < vertex_count for value in values)
                          if ok:
                              score += len(set(values))
                      elif index in animation_inputs:
                          ok = all(math.isfinite(v) and v >= 0 for v in values)
                          ok = ok and all(values[i] < values[i+1] for i in range(len(values)-1))
                          amin = accessor.get("min", [None])[0]
                          amax = accessor.get("max", [None])[0]
                          if ok and amin is not None:
                              ok = close(values[0], amin)
                          if ok and amax is not None:
                              ok = close(values[-1], amax)
                          if ok:
                              score += 100
                      else:
                          width = WIDTH[accessor["type"]]
                          if component == 5126:
                              ok = all(math.isfinite(v) for v in values)
                          amin = accessor.get("min")
                          amax = accessor.get("max")
                          if ok and amin is not None and amax is not None:
                              actual_min, actual_max = vector_bounds(values, width)
                              ok = all(close(actual_min[j], amin[j]) and close(actual_max[j], amax[j]) for j in range(width))
                              if ok:
                                  score += 50
                          elif ok and index in animation_outputs:
                              ok = all(-0.01 <= v <= 2.0 for v in values)
                              if ok:
                                  score += 10
                      if ok:
                          if offset == declared:
                              score += 1000
                          candidates.append((score, offset))
                  candidates.sort(reverse=True)
                  label = "indices" if index in primitive_index_map else "anim_in" if index in animation_inputs else "anim_out" if index in animation_outputs else "data"
                  print(f"accessor={index:02d} kind={label:8s} declared={declared:4d} candidates={candidates[:8]}")

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Khronos glTF validator
        run: npm install --no-save gltf-validator@2.0.0-dev.3.10

      - name: Validate Electro assets
        shell: bash
        run: |
          cat > validate-electro-gltf.cjs <<'NODE'
          const fs = require('fs');
          const validator = require('gltf-validator');
          (async () => {
            const files = [
              'assets/models/creatures/slime_electro/slime_electro.glb',
              'assets/models/creatures/slime_electro_large/slime_electro_large.glb',
            ];
            let failed = false;
            for (const file of files) {
              const report = await validator.validateBytes(new Uint8Array(fs.readFileSync(file)), {
                uri: file, format: 'glb', maxIssues: 0, writeTimestamp: false,
              });
              const grouped = {};
              for (const issue of report.issues?.messages ?? []) {
                const key = `${issue.code} @ ${issue.pointer}`;
                grouped[key] = (grouped[key] ?? 0) + 1;
              }
              console.log(`=== ${file}: errors=${report.issues?.numErrors ?? 0} warnings=${report.issues?.numWarnings ?? 0} ===`);
              for (const [key, count] of Object.entries(grouped)) console.log(`${count}x ${key}`);
              if ((report.issues?.numErrors ?? 0) > 0) failed = true;
            }
            if (failed) process.exit(1);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node ./validate-electro-gltf.cjs
