name: Rebuild Electro GLBs once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-electro-glb-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild valid GLB containers from complete source assets
        shell: python
        run: |
          import base64
          import json
          import pathlib
          import struct
          import subprocess

          SOURCE_REF = "35b8aaca906e1fdf48bae56feb4bb94b84814861"
          MODELS = (
              (
                  "assets/models/creatures/slime_electro/slime_electro.gltf",
                  "assets/models/creatures/slime_electro/slime_electro.glb",
              ),
              (
                  "assets/models/creatures/slime_electro_large/slime_electro_large.gltf",
                  "assets/models/creatures/slime_electro_large/slime_electro_large.glb",
              ),
          )

          COMPONENT_SIZE = {5120: 1, 5121: 1, 5122: 2, 5123: 2, 5125: 4, 5126: 4}
          TYPE_COMPONENTS = {
              "SCALAR": 1,
              "VEC2": 2,
              "VEC3": 3,
              "VEC4": 4,
              "MAT2": 4,
              "MAT3": 9,
              "MAT4": 16,
          }

          def decode_data_uri(uri: str):
              prefix, encoded = uri.split(",", 1)
              if ";base64" not in prefix:
                  raise ValueError(f"expected base64 data URI, got {prefix!r}")
              mime = prefix.removeprefix("data:").split(";", 1)[0]
              return mime, base64.b64decode(encoded, validate=True)

          def align4(data: bytearray, pad: int = 0):
              while len(data) % 4:
                  data.append(pad)

          def validate_document(doc, buffer_bytes: bytes):
              views = doc.get("bufferViews", [])
              for index, view in enumerate(views):
                  if view.get("buffer", 0) != 0:
                      raise ValueError(f"bufferView {index} references unsupported buffer")
                  offset = view.get("byteOffset", 0)
                  length = view["byteLength"]
                  if offset < 0 or length < 0 or offset + length > len(buffer_bytes):
                      raise ValueError(
                          f"bufferView {index} out of range: offset={offset} length={length} "
                          f"buffer={len(buffer_bytes)}"
                      )

              for index, accessor in enumerate(doc.get("accessors", [])):
                  view_index = accessor.get("bufferView")
                  if view_index is None:
                      continue
                  view = views[view_index]
                  component_size = COMPONENT_SIZE[accessor["componentType"]]
                  components = TYPE_COMPONENTS[accessor["type"]]
                  element_size = component_size * components
                  stride = view.get("byteStride", element_size)
                  accessor_offset = accessor.get("byteOffset", 0)
                  count = accessor["count"]
                  required = accessor_offset if count == 0 else accessor_offset + (count - 1) * stride + element_size
                  if required > view["byteLength"]:
                      raise ValueError(
                          f"accessor {index} exceeds bufferView {view_index}: "
                          f"required={required} view={view['byteLength']}"
                      )

          def rebuild(source_path: str, output_path: str):
              source = subprocess.check_output(
                  ["git", "show", f"{SOURCE_REF}:{source_path}"],
                  text=True,
              )
              doc = json.loads(source)
              buffers = doc.get("buffers", [])
              if len(buffers) != 1:
                  raise ValueError(f"{source_path}: expected exactly one buffer")

              buffer_uri = buffers[0].get("uri")
              if not buffer_uri or not buffer_uri.startswith("data:"):
                  raise ValueError(f"{source_path}: expected embedded buffer data URI")
              _, decoded_buffer = decode_data_uri(buffer_uri)
              declared_length = buffers[0]["byteLength"]
              if len(decoded_buffer) < declared_length:
                  raise ValueError(
                      f"{source_path}: embedded buffer is truncated: "
                      f"decoded={len(decoded_buffer)} declared={declared_length}"
                  )
              if len(decoded_buffer) > declared_length:
                  print(
                      f"{source_path}: dropping {len(decoded_buffer) - declared_length} trailing "
                      "bytes beyond declared buffer length"
                  )
              raw_buffer = decoded_buffer[:declared_length]

              binary = bytearray(raw_buffer)
              validate_document(doc, binary)

              for image in doc.get("images", []):
                  uri = image.get("uri")
                  if not uri or not uri.startswith("data:"):
                      continue
                  mime, image_bytes = decode_data_uri(uri)
                  align4(binary)
                  image_offset = len(binary)
                  binary.extend(image_bytes)
                  view_index = len(doc.setdefault("bufferViews", []))
                  doc["bufferViews"].append(
                      {
                          "buffer": 0,
                          "byteOffset": image_offset,
                          "byteLength": len(image_bytes),
                      }
                  )
                  image.pop("uri", None)
                  image["bufferView"] = view_index
                  image["mimeType"] = mime

              align4(binary)
              doc["buffers"] = [{"byteLength": len(binary)}]
              validate_document(doc, binary)

              json_bytes = json.dumps(doc, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              json_padded = bytearray(json_bytes)
              align4(json_padded, 0x20)

              total_length = 12 + 8 + len(json_padded) + 8 + len(binary)
              output = bytearray()
              output.extend(struct.pack("<4sII", b"glTF", 2, total_length))
              output.extend(struct.pack("<I4s", len(json_padded), b"JSON"))
              output.extend(json_padded)
              output.extend(struct.pack("<I4s", len(binary), b"BIN\0"))
              output.extend(binary)

              magic, version, declared_total = struct.unpack_from("<4sII", output, 0)
              if magic != b"glTF" or version != 2 or declared_total != len(output):
                  raise ValueError(f"{output_path}: invalid GLB header after rebuild")
              json_len, json_type = struct.unpack_from("<I4s", output, 12)
              bin_header = 20 + json_len
              bin_len, bin_type = struct.unpack_from("<I4s", output, bin_header)
              if json_type != b"JSON" or bin_type != b"BIN\0":
                  raise ValueError(f"{output_path}: invalid GLB chunk types")
              if bin_header + 8 + bin_len != len(output):
                  raise ValueError(f"{output_path}: GLB chunk lengths do not match file length")

              pathlib.Path(output_path).write_bytes(output)
              print(
                  f"rebuilt {output_path}: source_buffer={len(raw_buffer)} "
                  f"final_bin={len(binary)} total={len(output)} images={len(doc.get('images', []))}"
              )

          for source_path, output_path in MODELS:
              rebuild(source_path, output_path)

      - name: Commit rebuilt assets
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures/slime_electro/slime_electro.glb \
                  assets/models/creatures/slime_electro_large/slime_electro_large.glb
          git diff --cached --check
          git commit -m "Rebuild Electro GLB containers"
          git push origin HEAD:develop
