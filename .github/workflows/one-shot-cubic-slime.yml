name: One-shot cubic slime asset build

on:
  push:
    branches: [develop]
    paths: [.github/workflows/one-shot-cubic-slime.yml]

permissions:
  contents: write

jobs:
  build-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - name: Generate and verify model and skin
        run: |
          python assets/models/creatures/slime/generate_slime.py
          echo 'd7b4cbdfe76c6f2e4a89aa0d02bc8e0d72dad8446759c4f8b6b94a5abf878701  assets/models/creatures/slime/slime.glb' | sha256sum --check
          echo '8031760f7eb532a74a9d7d9b5ee20ecf4165146df3682ea1eaf95d66a0eb7c77  assets/models/creatures/slime/slime_skin_64.png' | sha256sum --check
          git diff --exit-code -- assets/models/creatures/slime/slime.collider.json
      - name: Commit generated assets and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/models/creatures/slime/slime.glb assets/models/creatures/slime/slime_skin_64.png
          git rm -- .github/workflows/one-shot-cubic-slime.yml
          git diff --cached --check
          git commit -m 'fix(assets): publish sharp cubic slime GLB with embedded 64x64 pixel skin'
          git push origin HEAD:develop
