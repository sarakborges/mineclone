name: One-shot cubic slime migration

on:
  push:
    branches: [develop]
    paths: [.github/workflows/one-shot-cubic-slime.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate model, species PNGs, and wire creature JSON to renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/one_shot_cubic_slime.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('0.18.0') == 1
          path.write_text(text.replace('0.18.0', '0.18.1'), encoding='utf-8')
          PY
          python3 tools/one_shot_cubic_slime.py
      - name: Format and commit without temporary workflow or patch script
        run: |
          rustfmt --edition 2024 src/content/creature.rs src/creatures/visual.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- VERSION assets/models/creatures/slime/generate_slime.py assets/models/creatures/slime/slime.glb assets/textures/creatures/meadow_slime.png assets/textures/creatures/ember_slime.png data/creatures/slimes/meadow.json data/creatures/slimes/ember.json src/content/creature.rs src/creatures/visual.rs
          git rm -f -- tools/one_shot_cubic_slime.py .github/workflows/one-shot-cubic-slime.yml
          git diff --cached --check
          git commit -m 'feat(creatures): cubical slimes with JSON-driven external 64px skins'
          git push origin HEAD:develop
