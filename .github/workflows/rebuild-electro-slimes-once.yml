name: Rebuild Electro slimes once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-electro-slimes-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate fresh Electro models from slime_blob language
        run: python assets/models/creatures/slime_electro/generate_slime_electro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Khronos glTF validator
        run: npm install --no-save gltf-validator@2.0.0-dev.3.10

      - name: Require zero Electro glTF issues
        shell: bash
        run: |
          cat > validate-electro-gltf.cjs <<'NODE'
          const fs = require('fs');
          const validator = require('gltf-validator');
          (async () => {
            const files = [
              'assets/models/creatures/slime_electro/slime_electro.glb',
              'assets/models/creatures/slime_electro_large/slime_electro_large.glb',
            ];
            let failed = false;
            for (const file of files) {
              const report = await validator.validateBytes(
                new Uint8Array(fs.readFileSync(file)),
                { uri: file, format: 'glb', maxIssues: 0, writeTimestamp: false }
              );
              const errors = report.issues?.numErrors ?? 0;
              const warnings = report.issues?.numWarnings ?? 0;
              console.log(`${file}: errors=${errors} warnings=${warnings}`);
              if (errors || warnings) {
                console.log(JSON.stringify(report.issues?.messages ?? [], null, 2));
                failed = true;
              }
            }
            if (failed) process.exit(1);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node ./validate-electro-gltf.cjs

      - name: Commit rebuilt assets
        shell: bash
        run: |
          git config user.name "Sara Borges"
          git config user.email "sarakborges@outlook.com"
          git add \
            assets/models/creatures/slime_electro/slime_electro.glb \
            assets/models/creatures/slime_electro_large/slime_electro_large.glb
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "Rebuild Electro slimes from blob"
          git pull --rebase origin develop
          git push origin HEAD:develop
