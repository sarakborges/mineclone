name: Generate block icons

on:
  push:
    branches: [develop]
    paths:
      - tools/generate_block_icons.py
      - .github/workflows/generate-block-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/generate_block_icons.py

      - name: Commit generated icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/block_icons
          if git diff --cached --quiet; then
            echo "No icon changes"
            exit 0
          fi
          git commit -m "Generate block icon assets"
          git pull --rebase origin develop
          git push origin HEAD:develop
