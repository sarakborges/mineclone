name: Inspect generated native input migration
on:
  push:
    branches:
      - feature/native-input-diagnostics
    paths:
      - .github/workflows/inspect-native-input.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-input-diagnostics
          persist-credentials: true
      - name: Decode and apply existing migration script
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes brotli
          python - <<'PY'
          from pathlib import Path
          import base64, subprocess
          workflow = Path('.github/workflows/native-input-repair.yml').read_text()
          marker = "cat <<'PAYLOAD' | base64 --decode | brotli --decompress > /tmp/repair_text_inputs.py"
          payload = workflow.split(marker, 1)[1].split('PAYLOAD', 1)[0].strip()
          compressed = base64.b64decode(payload, validate=True)
          script = subprocess.run(['brotli', '--decompress'], input=compressed, capture_output=True, check=True).stdout
          Path('/tmp/repair_text_inputs.py').write_bytes(script)
          PY
          python /tmp/repair_text_inputs.py
      - name: Commit generated snapshot to diagnostic branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/repair_text_inputs.py scripts_native_input_snapshot.py
          git add -- Cargo.toml VERSION HANDOFF.md src scripts_native_input_snapshot.py
          git diff --cached --check
          git commit -m 'wip: capture native editor migration before validation'
          git push origin HEAD:feature/native-input-diagnostics
