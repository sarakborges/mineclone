name: Fix slime faces once

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-slime-faces:
    if: github.event.head_commit.message == 'Fix one-shot slime face fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fix source generators and Electro design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('assets/models/creatures/slime_blob/generate_slime_blob.py')
          text = base.read_text()
          old = 'fb=bucket();z=-BODY_DEPTH*.5-.006;w=.86;h=.48;yc=-.075;quad'
          new = 'fb=bucket();z=-BODY_DEPTH*.5-.006;w=.86;h=.86;yc=-.075;quad'
          if old not in text:
              raise SystemExit('slime_blob face dimensions pattern not found')
          base.write_text(text.replace(old, new, 1))

          electro = Path('assets/models/creatures/slime_electro/generate_slime_electro.py')
          text = electro.read_text()

          old_doc = '''"""Generate Electro Slime models from the rounded slime_blob body language.\n\nBoth sizes use the same authored design: golden blob body, a small central\nlightning antenna, stepped forehead circuit marks and the shared SlimeFace quad.\nThe face texture itself is intentionally external and must be mapped to the\nAnemo face texture by the creature definition.\n"""'''
          new_doc = '''"""Generate Electro Slime models from the rounded slime_blob body language.\n\nBoth sizes use a plain golden blob body, one small central lightning antenna,\nand a square SlimeFace quad. All other face/electric detail is texture-driven.\n"""'''
          if old_doc not in text:
              raise SystemExit('Electro docstring pattern not found')
          text = text.replace(old_doc, new_doc, 1)

          front_marks = '''        if normal == (0, 0, -1):\n            if -0.58 < gx < -0.24 and 0.63 < gy < 0.86:\n                return 6\n            if -0.72 < gx < -0.10 and 0.50 < gy < 0.88:\n                return 5\n            if gy < 0.13:\n'''
          plain_front = '''        if normal == (0, 0, -1):\n            if gy < 0.13:\n'''
          if front_marks not in text:
              raise SystemExit('Electro body front-mark pattern not found')
          text = text.replace(front_marks, plain_front, 1)

          face_dims = '''    face_w = body_width * (0.86 / 1.20)\n    face_h = body_height * 0.48\n'''
          square_face = '''    face_size = body_width * (0.86 / 1.20)\n    face_w = face_size\n    face_h = face_size\n'''
          if face_dims not in text:
              raise SystemExit('Electro face dimension pattern not found')
          text = text.replace(face_dims, square_face, 1)
          text = text.replace('"shared_anemo_face_quad"', '"slime_face_quad"', 1)

          details_start = text.index('    s = body_width / 1.20\n    accent = bucket()\n    pale = bucket()\n    white = bucket()\n')
          details_end = text.index('    materials = [', details_start)
          antenna_only = '''    # The antenna is the only Electro-specific geometry.\n    s = body_width / 1.20\n    accent = bucket()\n    white = bucket()\n\n    add_box(accent, (0.0, body_height * 0.5 + 0.055 * s, 0.0), (0.075 * s, 0.13 * s, 0.075 * s))\n    add_box(accent, (0.025 * s, body_height * 0.5 + 0.145 * s, 0.0), (0.085 * s, 0.08 * s, 0.085 * s))\n    add_box(white, (0.015 * s, body_height * 0.5 + 0.215 * s, 0.0), (0.13 * s, 0.08 * s, 0.11 * s))\n    add_box(white, (0.015 * s, body_height * 0.5 + 0.275 * s, 0.0), (0.085 * s, 0.06 * s, 0.075 * s))\n\n    antenna_primitives = [prim(accent, 7), prim(white, 9)]\n    meshes.append({"name": "electro_antenna", "primitives": [p for p in antenna_primitives if p]})\n    details_mesh = len(meshes) - 1\n\n'''
          text = text[:details_start] + antenna_only + text[details_end:]
          text = text.replace('node("ElectroDetails", mesh=details_mesh)', 'node("ElectroAntenna", mesh=details_mesh)', 1)
          text = text.replace('"face_source": "textures/creatures/slime_anemo/face.png"',
                              '"face_source": "textures/creatures/slime_electro/face.png"', 1)
          text = text.replace('Fresh Electro rebuild from slime_blob; no geometry/data reused from prior Electro GLBs.',
                              'Plain Electro blob + central antenna; face/electric ornament detail is texture-driven.', 1)
          electro.write_text(text)
          PY

      - name: Regenerate Electro slimes
        run: python assets/models/creatures/slime_electro/generate_slime_electro.py

      - name: Normalize every existing slime face quad
        run: python tools/fix_slime_face_quads.py

      - name: Verify square slime faces
        run: python tools/fix_slime_face_quads.py --check

      - name: Audit all GLB assets
        run: python tools/check_glb_assets.py

      - name: Verify Electro texture mapping and model source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = 'textures/creatures/slime_electro/face.png'
          for path in [Path('data/creatures/slime_electro.json'), Path('data/creatures/slime_electro_large.json')]:
              data = json.loads(path.read_text())
              actual = data.get('textures', {}).get('SlimeFace')
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected}, got {actual}')
          source = Path('assets/models/creatures/slime_electro/generate_slime_electro.py').read_text()
          forbidden = ['front_z =', 'pale = bucket()', 'stepped forehead circuit marks', 'shared_anemo_face_quad']
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'Electro source still contains forbidden feature token: {token}')
          print('Electro source contains only blob + antenna geometry and uses its own face texture')
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/creatures tools/fix_slime_face_quads.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Fix slime face aspect ratio and simplify Electro"
          git push origin HEAD:develop
