name: One-shot slime core and PNG face migration

on:
  push:
    branches: [develop]
    paths: [.github/workflows/one-shot-slime-face.yml]

permissions:
  contents: write

jobs:
  rebuild-slime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - name: Enlarge core, bake face into external PNGs, and validate assets
        run: python3 tools/one_shot_slime_face.py
      - name: Commit generated model, skins, JSON and version; remove temporary migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- VERSION assets/models/creatures/slime/generate_slime.py assets/models/creatures/slime/slime.glb assets/textures/creatures/meadow_slime.png assets/textures/creatures/ember_slime.png data/creatures/slimes/meadow.json data/creatures/slimes/ember.json
          git rm -f -- tools/one_shot_slime_face.py .github/workflows/one-shot-slime-face.yml
          git diff --cached --check
          git commit -m 'fix(creatures): enlarge slime core and bake face into species textures'
          git push origin HEAD:develop
