name: Apply conditional settings scrollbars
on:
  push:
    branches:
      - feature/game-chat-creature-command
    paths:
      - .github/workflows/apply-chat-scroll-fixes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-chat-creature-command
          persist-credentials: true
      - name: Change settings and new-world scrollbars
        shell: bash
        run: |
          set -euo pipefail
          file=src/screens/settings_screen/layout.rs
          test "$(grep -o persistent_vertical_scrollbar "$file" | wc -l)" -eq 3
          sed -i 's/persistent_vertical_scrollbar/vertical_scrollbar/g' "$file"
          test "$(cat VERSION)" = "0.17.0"
          echo 0.17.1 > VERSION
          echo '' >> HANDOFF.md
          echo '## Feature branch follow-up: settings and New World conditional scrollbars (0.17.1)' >> HANDOFF.md
          echo 'PR #10 targets feature/slime-creature-integration, not develop. Settings and New World share src/screens/settings_screen/layout.rs; sidebar and main-content scrollbars changed from persistent_vertical_scrollbar to vertical_scrollbar. The shared AutoScrollbar checks measured content overflow and hides again below the threshold. Inventory category/catalog and chat use the same automatic policy. No gameplay or UI resize test is confirmed. Initial PR #10 CI run 35148336319 failed on genuine Rust visibility and Clippy argument-count diagnostics in creature visual and chat; those remain open until separately fixed and CI passes. Preserve the nine preexisting world defects as open. User explicitly requires branch-only code changes.' >> HANDOFF.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/apply-chat-scroll-fixes.yml
          git add -- "$file" VERSION HANDOFF.md
          git diff --cached --check
          git commit -m 'fix(settings): conditional scrollbars for settings and new world'
          git push origin HEAD:feature/game-chat-creature-command
