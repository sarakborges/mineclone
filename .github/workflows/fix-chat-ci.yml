name: Repair and validate chat feature

on:
  push:
    branches:
      - feature/game-chat-creature-command
    paths:
      - .github/workflows/fix-chat-ci.yml
      - src/ui/scrollbar.rs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/game-chat-creature-command
          persist-credentials: true
      - name: Apply guarded source repair
        run: python scripts/repair_chat_feature.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev \
            libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Clippy with all warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo check
        run: cargo check
      - name: Commit only validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/fix-chat-ci.yml scripts/repair_chat_feature.py
          git add -- src/creatures/visual.rs src/hud/chat.rs src/hud/chat/visual.rs VERSION HANDOFF.md
          git diff --cached --check
          git commit -m 'fix(ci): repair creature and chat Rust diagnostics'
          git push origin HEAD:feature/game-chat-creature-command
