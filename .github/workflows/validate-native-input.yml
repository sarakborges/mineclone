name: Validate complete native text inputs
on:
  push:
    branches:
      - feature/native-input-diagnostics
    paths:
      - .github/workflows/validate-native-input.yml
      - scripts/repair_native_input_diagnostics.py
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-input-diagnostics
          persist-credentials: true
      - name: Apply guarded integration fixes
        run: python scripts/repair_native_input_followup.py
      - name: Correct Clippy and Settings context
        run: python scripts/repair_native_input_diagnostics.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo check
        run: cargo check
      - name: Unit tests
        run: cargo test --all-targets --all-features
      - name: Publish only validated changes on diagnostic branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/validate-native-input.yml .github/workflows/inspect-native-input.yml .github/workflows/native-input-repair.yml scripts_native_input_snapshot.py scripts/repair_native_input_followup.py scripts/repair_native_input_diagnostics.py
          git add -- Cargo.toml VERSION HANDOFF.md src
          git diff --cached --check
          git commit -m 'fix(ui): use native text editing and system clipboard across all text fields'
          git push origin HEAD:feature/native-input-diagnostics
