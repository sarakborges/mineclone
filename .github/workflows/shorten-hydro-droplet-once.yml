name: Shorten Hydro droplet once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/shorten-hydro-droplet-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shorten Hydro top droplet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          gen = root / 'assets/models/creatures/slime_hydro/generate_slime_hydro.py'
          text = gen.read_text()
          old = '    cell_y = 0.055 * s\n'
          new = '    # Keep the droplet broad, but compress it vertically so it reads as a drop rather than a spike.\n    cell_y = 0.040 * s\n'
          if old not in text:
              raise SystemExit('expected Hydro cell_y line not found')
          text = text.replace(old, new, 1)
          text = text.replace('Asteria Hydro integrated droplet rebuild v2', 'Asteria Hydro integrated droplet rebuild v3', 1)
          gen.write_text(text)

          for rel in [
              'assets/models/creatures/slime_hydro/slime_hydro.collider.json',
              'assets/models/creatures/slime_hydro_large/slime_hydro_large.collider.json',
          ]:
              p = root / rel
              data = json.loads(p.read_text())
              data.setdefault('authoring', {})['reference'] = (
                  'Hydro top is a short broad droplet-shaped continuation of the slime body; '
                  'height reduced to avoid a spike silhouette while preserving the exact top-color root.'
              )
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          (root / 'VERSION').write_text('0.68.61\n')
          handoff = root / 'HANDOFF.md'
          if handoff.exists():
              note = '- 0.68.61: Hydro droplet vertically compressed while preserving its broad integrated root and existing shading, changing the silhouette from a tall spike to a shorter water-drop continuation. Pyro unchanged.'
              h = handoff.read_text().rstrip()
              if note not in h:
                  handoff.write_text(h + '\n\n' + note + '\n')
          PY

      - name: Generate Hydro GLBs
        run: python assets/models/creatures/slime_hydro/generate_slime_hydro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Audit Hydro height and geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          def load(path):
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              return doc, b[off:off+bl]

          def check(path, max_height):
              doc, binary = load(path)
              vh = doc['extras']['visual_height']
              if vh > max_height:
                  raise SystemExit(f'{path}: Hydro still too tall: {vh} > {max_height}')
              mesh = next(m for m in doc['meshes'] if m['name'] == 'hydro_water_droplet')
              mats = {p['material'] for p in mesh['primitives']}
              if 5 not in mats or len(mats) < 4:
                  raise SystemExit(f'{path}: Hydro top material/shading regression: {sorted(mats)}')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset',0) + a.get('byteOffset',0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base+i*12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal normals')
              print(path, 'visual_height=', vh, 'materials=', sorted(mats))

          check(Path('assets/models/creatures/slime_hydro/slime_hydro.glb'), 1.31)
          check(Path('assets/models/creatures/slime_hydro_large/slime_hydro_large.glb'), 2.12)
          PY

      - name: Commit shortened Hydro
        shell: bash
        run: |
          rm -f .github/workflows/shorten-hydro-droplet-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Shorten Hydro droplet silhouette"
          git push origin develop
