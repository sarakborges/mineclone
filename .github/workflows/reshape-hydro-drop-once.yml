name: Reshape Hydro drop once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/reshape-hydro-drop-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reshape Hydro droplet
        run: python tools/reshape_hydro_drop_once.py

      - name: Generate Hydro GLBs
        run: python assets/models/creatures/slime_hydro/generate_slime_hydro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Audit Hydro teardrop geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          def load(path):
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              return doc, binary

          for path in [
              Path('assets/models/creatures/slime_hydro/slime_hydro.glb'),
              Path('assets/models/creatures/slime_hydro_large/slime_hydro_large.glb'),
          ]:
              doc, binary = load(path)
              mesh = next(m for m in doc['meshes'] if m['name'] == 'hydro_water_droplet')
              mats = {p['material'] for p in mesh['primitives']}
              if 5 not in mats:
                  raise SystemExit(f'{path}: missing slime-top root material')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset', 0) + a.get('byteOffset', 0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base + i * 12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal normals')
              width = float(doc['extras']['visual_width'])
              height = float(doc['extras']['visual_height'])
              print(path, 'OK', 'materials=', sorted(mats), 'visual_width=', width, 'visual_height=', height)
          PY

      - name: Commit Hydro teardrop fix
        shell: bash
        run: |
          rm -f .github/workflows/reshape-hydro-drop-once.yml
          rm -f tools/reshape_hydro_drop_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reshape Hydro top into teardrop"
          git push origin develop
