name: Rebuild Hydro droplet once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-hydro-droplet-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Hydro generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('assets/models/creatures/slime_geo/generate_slime_geo.py')
          dst = Path('assets/models/creatures/slime_hydro/generate_slime_hydro.py')
          text = src.read_text()

          doc_end = text.index('"""', 3) + 3
          text = '''#!/usr/bin/env python3
          """Generate pixel-art Hydro Slime models from the rounded slime_blob body language.

          The Hydro body is a clean turquoise blob with no horns, armor, or side features.
          Its only modeled elemental feature is one water droplet growing directly from the
          top of the body. The droplet tapers through axis-aligned voxel stair-steps so the
          silhouette reads as pixel art without smooth curves or diagonal faces. The face
          remains a square texture-driven SlimeFace decal.
          """''' + text[doc_end:]
          text = text.replace('\n          ', '\n')

          p0 = text.index('PALETTE = (')
          p1 = text.index('\n\n\ndef lin', p0)
          palette = '''PALETTE = (
              ("SlimeShell", (0.17, 0.68, 0.72)),
              ("SlimeShellCenter", (0.28, 0.78, 0.81)),
              ("SlimeShellOuter", (0.10, 0.55, 0.61)),
              ("SlimeShellBottom", (0.31, 0.80, 0.82)),
              ("SlimeShellTop", (0.12, 0.61, 0.66)),
              ("SlimeShellLight", (0.40, 0.87, 0.88)),
              ("SlimeShellBright", (0.60, 0.95, 0.95)),
              ("ElementAccent", (0.08, 0.53, 0.66)),
              ("ElementPale", (0.38, 0.86, 0.93)),
              ("ElementDark", (0.05, 0.39, 0.53)),
              ("ElementWhite", (0.70, 0.97, 1.00)),
          )'''
          text = text[:p0] + palette + text[p1:]

          b0 = text.index('    def body_material')
          b1 = text.index('    def bucket():', b0)
          body = '''    def body_material(ix: int, iy: int, iz: int, normal) -> int:
              gx = (ix - cx_mid) / (NX * 0.5)
              gy = iy / (NY - 1)
              gz = (iz - cz_mid) / (NZ * 0.5)

              # Clean water blob: only soft blocky value variation, no armor pattern.
              if normal == (0, 0, -1):
                  if gy < 0.16:
                      return 3
                  if abs(gx) > 0.74:
                      return 2
                  if gy > 0.80:
                      return 4
                  if abs(gx) < 0.58 and 0.18 < gy < 0.72:
                      return 1
                  return 0
              if normal == (0, 1, 0):
                  return 5 if gy > 0.70 else 4
              if normal == (0, -1, 0):
                  return 3
              if normal == (1, 0, 0):
                  return 2
              if normal == (-1, 0, 0):
                  return 0
              if normal == (0, 0, 1):
                  return 2 if abs(gx) > 0.68 or abs(gz) > 0.68 else 0
              return 0

'''
          text = text[:b0] + body + text[b1:]
          text = text.replace('"geo_blob_body"', '"hydro_blob_body"')

          d0 = text.index('    s = body_width / 1.20')
          d1 = text.index('    materials = [', d0)
          details = '''    s = body_width / 1.20
              water_dark = bucket()
              water_mid = bucket()
              water_light = bucket()
              top = body_height * 0.5

              def drop_step(bucket_, x, y, z, w, h, d):
                  add_box(bucket_, (x * s, top + y * s, z * s), (w * s, h * s, d * s))

              # A single droplet grows out of the top surface. The lowest layer is
              # intentionally buried in the blob so it never reads as a floating prop.
              if not large:
                  for x, y, z, w, h, d, mat in [
                      ( 0.000, -0.080, 0.015, 0.34, 0.20, 0.30, water_dark),
                      ( 0.000,  0.055, 0.010, 0.30, 0.16, 0.27, water_mid),
                      ( 0.008,  0.165, 0.005, 0.24, 0.13, 0.22, water_mid),
                      ( 0.018,  0.255, 0.000, 0.18, 0.10, 0.17, water_light),
                      ( 0.030,  0.323,-0.004, 0.12, 0.075,0.12, water_light),
                      ( 0.042,  0.372,-0.008, 0.065,0.050,0.07, water_light),
                  ]:
                      drop_step(mat, x, y, z, w, h, d)
                  detail_height = 0.40 * s
                  detail_width = 0.34 * s
              else:
                  for x, y, z, w, h, d, mat in [
                      ( 0.000, -0.095, 0.018, 0.39, 0.23, 0.35, water_dark),
                      ( 0.000,  0.060, 0.012, 0.35, 0.19, 0.31, water_mid),
                      ( 0.010,  0.190, 0.006, 0.28, 0.15, 0.25, water_mid),
                      ( 0.022,  0.295, 0.000, 0.21, 0.12, 0.20, water_light),
                      ( 0.036,  0.375,-0.006, 0.15, 0.09, 0.15, water_light),
                      ( 0.050,  0.435,-0.010, 0.09, 0.065,0.10, water_light),
                      ( 0.060,  0.478,-0.014, 0.05, 0.045,0.06, water_light),
                  ]:
                      drop_step(mat, x, y, z, w, h, d)
                  detail_height = 0.50 * s
                  detail_width = 0.39 * s

              details_prims = [
                  prim(water_dark, 9),
                  prim(water_mid, 7),
                  prim(water_light, 10),
              ]
              meshes.append({"name": "hydro_water_droplet", "primitives": [p for p in details_prims if p]})
              details_mesh = len(meshes) - 1

'''
          details = details.replace('\n              ', '\n    ')
          text = text[:d0] + details + text[d1:]

          text = text.replace('details_node = node("GeoRockShell", mesh=details_mesh)', 'details_node = node("HydroDroplet", mesh=details_mesh)')
          text = text.replace('details_node = node("GeoRockCap", mesh=details_mesh)', 'details_node = node("HydroDroplet", mesh=details_mesh)')
          text = text.replace('details_node = node("GeoCrown", mesh=details_mesh)', 'details_node = node("HydroDroplet", mesh=details_mesh)')

          text = text.replace('collider_size = [1.287, 1.1928, 1.2784]', 'collider_size = [1.248, 1.26, 1.2376]')
          text = text.replace('collider_y = 0.5964', 'collider_y = 0.63')
          text = text.replace('"Asteria Geo integrated rock shell rebuild v2"', '"Asteria Hydro droplet rebuild v1"')
          text = text.replace('"Asteria Geo slime stone crown rebuild v1"', '"Asteria Hydro droplet rebuild v1"')
          text = text.replace('"asteria:{asset_id}"', '"asteria:{asset_id}"')
          text = text.replace('"face_source": "textures/creatures/slime_geo/face.png"', '"face_source": "textures/creatures/slime_hydro/face.png"')
          text = text.replace('"base_language": "slime_blob"', '"base_language": "slime_blob"')

          # Replace Geo-only extras regardless of which previous Geo generator wording is present.
          import re
          text = re.sub(r'\s+"pixel_art_geometry": "[^"]*",', '\n            "pixel_art_geometry": "Hydro droplet uses only axis-aligned voxel boxes; taper is expressed through stepped layer size changes",', text)
          text = re.sub(r'\s+"reference_design": "[^"]*",', '\n            "reference_design": "clean turquoise water blob with no horns and one integrated teardrop on top",', text)

          # Main outputs and dimensions.
          m0 = text.index('def main() -> None:')
          text = text[:m0] + '''def main() -> None:
              small = generate("slime_hydro", ROOT / "slime_hydro.glb", 1.20, 1.00, 1.14, False)
              large_dir = ROOT.parent / "slime_hydro_large"
              large = generate("slime_hydro_large", large_dir / "slime_hydro_large.glb", 1.92, 1.50, 1.82, True)
              print("small", small)
              print("large", large)


          if __name__ == "__main__":
              main()
          '''.replace('\n              ', '\n    ').replace('\n          ', '\n')

          dst.write_text(text)
          PY

      - name: Generate Hydro GLBs
        run: python assets/models/creatures/slime_hydro/generate_slime_hydro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Enforce Hydro pixel-art droplet geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          for path in [Path('assets/models/creatures/slime_hydro/slime_hydro.glb'), Path('assets/models/creatures/slime_hydro_large/slime_hydro_large.glb')]:
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              mesh = next(m for m in doc['meshes'] if m['name'] == 'hydro_water_droplet')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']; a = doc['accessors'][ai]; v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset',0) + a.get('byteOffset',0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base+i*12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal droplet normals')
              print(path, 'Hydro droplet pixel-art normals OK')
          PY

      - name: Update Hydro metadata and version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('assets/models/creatures/slime_hydro/slime_hydro.collider.json'), Path('assets/models/creatures/slime_hydro_large/slime_hydro_large.collider.json')]:
              d=json.loads(path.read_text())
              d['authoring']['construction']='clean turquoise slime_blob body + one partially embedded stepped water droplet on top + square texture-driven face'
              d['authoring']['reference']='user Hydro reference: no horns; replace them with one teardrop-shaped water feature centered on top'
              path.write_text(json.dumps(d, indent=2, ensure_ascii=False)+'\n')
          Path('VERSION').write_text('0.68.57\n')
          h=Path('HANDOFF.md')
          if h.exists():
              t=h.read_text()
              note='\n- 0.68.57: Hydro Slime rebuilt from the reference as a clean turquoise blob with no horns. Normal and large now use one integrated top water droplet, tapered only with cardinal voxel stair-steps; face remains texture-driven.\n'
              if note.strip() not in t:
                  h.write_text(t.rstrip()+note)
          PY

      - name: Commit rebuilt Hydro assets and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-hydro-droplet-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Hydro slime with pixel-art water droplet"
          git push origin develop
