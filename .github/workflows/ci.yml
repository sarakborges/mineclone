name: Rust validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Normalize formatting
        run: cargo fmt --all

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-sources
          path: |
            src/**/*.rs
            build.rs
          if-no-files-found: error

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Format
        run: git diff --exit-code -- '*.rs'
