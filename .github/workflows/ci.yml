name: Rust validation

on:
  pull_request:
    paths-ignore:
      - HANDOFF.md
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - HANDOFF.md

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep the OS fixed: native package archives and compiler outputs are
    # specific to the runner distribution and Rust toolchain.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fail early on malformed content/assets before spending time restoring
      # the Rust toolchain and Bevy system dependencies.
      - name: Audit localizations
        run: python3 tools/check_localizations.py

      - name: Audit structure content references
        run: python3 tools/check_content_references.py

      - name: Audit GLB assets
        run: python3 tools/check_glb_assets.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The first run installs the Bevy system libraries; subsequent runs
      # restore their installed files instead of repeating apt-get install.
      - name: Cache Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev
            libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
          version: ubuntu-24.04-bevy-0.19-v1

      # Cargo.lock is committed for reproducible executable builds.
      - name: Report dependency lock
        run: sha256sum Cargo.lock

      # Cache downloaded crates and compiled dependency artifacts. The key
      # includes the committed lockfile, so dependency versions remain stable.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --locked

      # Build the actual game binary because its --biome-map path uses the same
      # content loader, WorldGenerator and BiomeQueries as runtime gameplay.
      - name: Build biome map CLI
        run: cargo build --locked --bin asteria

      # Phase 3 visual fixtures are produced by the game's authoritative
      # biome-map path. These are executable smoke renders, not `cargo test`.
      - name: Render biome map fixtures
        timeout-minutes: 2
        run: |
          mkdir -p target/biome-maps
          RUST_HOST="$(rustc -vV | sed -n 's/^host: //p')"
          RUST_RUNTIME="$(rustc --print sysroot)/lib/rustlib/$RUST_HOST/lib"
          export LD_LIBRARY_PATH="$PWD/target/debug/deps:$RUST_RUNTIME${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          /usr/bin/time -f 'overworld seed 0: %e s' target/debug/asteria --biome-map --seed 0 --dimension asteria:overworld --output target/biome-maps/overworld-seed-0.png --scale 8 --width 256 --height 256
          /usr/bin/time -f 'overworld seed 1337: %e s' target/debug/asteria --biome-map --seed 1337 --dimension asteria:overworld --output target/biome-maps/overworld-seed-1337.png --scale 8 --width 256 --height 256
          /usr/bin/time -f 'umbral seed 0: %e s' target/debug/asteria --biome-map --seed 0 --dimension asteria:umbral --output target/biome-maps/umbral-seed-0.png --scale 8 --width 256 --height 256
          /usr/bin/time -f 'umbral seed 1337: %e s' target/debug/asteria --biome-map --seed 1337 --dimension asteria:umbral --output target/biome-maps/umbral-seed-1337.png --scale 8 --width 256 --height 256

      - name: Upload biome map fixtures
        uses: actions/upload-artifact@v4
        with:
          name: biome-map-fixtures
          path: target/biome-maps/
          if-no-files-found: error
          retention-days: 7
