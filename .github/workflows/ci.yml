name: Rust validation

on:
  pull_request:
    paths-ignore:
      - HANDOFF.md
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - HANDOFF.md

permissions:
  contents: read

jobs:
  validate:
    # Keep the OS fixed: native package archives and compiler outputs are
    # specific to the runner distribution and Rust toolchain.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # cargo check and Clippy do not execute UiLocalization::load(), which
      # requires every language to match English at runtime. Validate the same
      # invariants before installing dependencies or compiling the game.
      - name: Validate UI localizations
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('data/localization')
          english = json.loads((root / 'english.json').read_text(encoding='utf-8'))
          expected = set(english)
          placeholders = lambda text: set(re.findall(r'\{([^{}]*)\}', text))
          errors = []
          for language in ('english', 'portuguese_brazil', 'spanish'):
              strings = json.loads((root / f'{language}.json').read_text(encoding='utf-8'))
              actual = set(strings)
              for key in sorted(expected - actual):
                  errors.append(f'{language}: missing key {key}')
              for key in sorted(actual - expected):
                  errors.append(f'{language}: unexpected key {key}')
              for key in sorted(expected & actual):
                  if not strings[key].strip():
                      errors.append(f'{language}: empty key {key}')
                  if placeholders(strings[key]) != placeholders(english[key]):
                      errors.append(f'{language}: mismatched placeholders for {key}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'UI localization OK: {len(expected)} keys in all three languages.')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The first run installs the Bevy system libraries; subsequent runs
      # restore their installed files instead of repeating apt-get install.
      - name: Cache Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev
            libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
          version: ubuntu-24.04-bevy-0.19-v1

      # Cargo.lock is intentionally gitignored. Without restoring it BEFORE
      # rust-cache, every fresh runner resolves hundreds of dependencies again,
      # potentially downloading newer crates and invalidating compiled artifacts
      # even when the Cargo cache reports an exact hit.
      - name: Cache CI Cargo.lock
        id: cargo-lock
        uses: actions/cache@v5
        with:
          path: Cargo.lock
          key: ubuntu-24.04-cargo-lock-v1-${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}

      # On a cold cache only: generate the lock before rust-cache computes its
      # dependency key; the cache action saves this file at the end of the job.
      - name: Resolve dependencies on cache miss
        if: steps.cargo-lock.outputs.cache-hit != 'true'
        run: cargo generate-lockfile

      # Provide auditable evidence that the lockfile and crate versions remain
      # stable across commits. A true cache hit skips dependency resolution.
      - name: Report dependency cache
        run: |
          echo "Cargo.lock restored from cache: ${{ steps.cargo-lock.outputs.cache-hit }}"
          sha256sum Cargo.lock

      # Cache downloaded crates and compiled dependency artifacts. The key
      # now sees the restored lockfile, keeping crate versions stable across
      # successive commits instead of repeatedly rebuilding Bevy.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --locked
