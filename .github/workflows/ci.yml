name: Rust validation

on:
  pull_request:
    paths-ignore:
      - HANDOFF.md
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - HANDOFF.md

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep the OS fixed: native package archives and compiler outputs are
    # specific to the runner distribution and Rust toolchain.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fail early on malformed content/assets before spending time restoring
      # the Rust toolchain and Bevy system dependencies.
      - name: Audit localizations
        run: python3 tools/check_localizations.py

      - name: Audit structure content references
        run: python3 tools/check_content_references.py

      - name: Audit GLB assets
        run: python3 tools/check_glb_assets.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The first run installs the Bevy system libraries; subsequent runs
      # restore their installed files instead of repeating apt-get install.
      - name: Cache Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev
            libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
          version: ubuntu-24.04-bevy-0.19-v1

      # Cargo.lock is committed for reproducible executable builds.
      - name: Report dependency lock
        run: sha256sum Cargo.lock

      # Cache downloaded crates and compiled dependency artifacts. The key
      # includes the committed lockfile, so dependency versions remain stable.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --locked

      # Temporary Phase 4 visual validation. This step is removed after its
      # artifacts are inspected; terrain debug remains an on-demand consumer.
      - name: Render representative terrain windows
        run: |
          set -euo pipefail
          mkdir -p terrain-validation
          cargo build --locked
          export LD_LIBRARY_PATH="$PWD/target/debug/deps:${LD_LIBRARY_PATH:-}"
          ./target/debug/asteria \
            --biome-map \
            --seed 0 \
            --output terrain-validation/biomes.png \
            --center-x 0 \
            --center-z 0 \
            --scale 64 \
            --width 512 \
            --height 512 \
            --no-influences \
            --no-boundaries

          python3 - <<'PY'
          import json
          import subprocess
          import sys

          try:
              from PIL import Image
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "pillow"])
              from PIL import Image

          with open("terrain-validation/biomes.legend.json", encoding="utf-8") as handle:
              legend = json.load(handle)
          entry = next(
              (item for item in legend["biomes"] if item["id"] == "asteria:overworld/floating_islands"),
              None,
          )
          if entry is None:
              raise SystemExit("floating_islands missing from biome map legend")

          image = Image.open("terrain-validation/biomes.png").convert("RGB")
          pixels = image.load()
          target = tuple(entry["rgb"])
          matches = []
          edges = []
          for py in range(image.height):
              for px in range(image.width):
                  if pixels[px, py] != target:
                      continue
                  matches.append((px, py))
                  if (
                      px == 0
                      or py == 0
                      or px + 1 == image.width
                      or py + 1 == image.height
                      or pixels[px - 1, py] != target
                      or pixels[px + 1, py] != target
                      or pixels[px, py - 1] != target
                      or pixels[px, py + 1] != target
                  ):
                      edges.append((px, py))
          if not matches:
              raise SystemExit("no floating_islands pixel found in representative biome window")
          if not edges:
              raise SystemExit("no floating_islands boundary found in representative biome window")

          mean_x = sum(px for px, _ in matches) / len(matches)
          mean_y = sum(py for _, py in matches) / len(matches)
          interior = min(matches, key=lambda p: (p[0] - mean_x) ** 2 + (p[1] - mean_y) ** 2)
          edge = min(edges, key=lambda p: (p[0] - interior[0]) ** 2 + (p[1] - interior[1]) ** 2)
          origin_x, origin_z = legend["sampleOrigin"]
          scale = legend["blocksPerPixel"]

          def world(pixel):
              return origin_x + pixel[0] * scale, origin_z + pixel[1] * scale

          float_x, float_z = world(interior)
          edge_x, edge_z = world(edge)
          with open("terrain-validation/coords.env", "w", encoding="utf-8") as handle:
              handle.write(f"FLOAT_X={float_x}\nFLOAT_Z={float_z}\nEDGE_X={edge_x}\nEDGE_Z={edge_z}\n")
          print(f"floating interior=({float_x}, {float_z}) boundary=({edge_x}, {edge_z})")
          PY

          source terrain-validation/coords.env
          ./target/debug/asteria \
            --terrain-debug \
            --seed 0 \
            --output terrain-validation/floating.png \
            --center-x "$FLOAT_X" \
            --center-y 240 \
            --center-z "$FLOAT_Z" \
            --scale 1 \
            --width 384 \
            --height 192
          ./target/debug/asteria \
            --terrain-debug \
            --seed 0 \
            --output terrain-validation/floating-edge.png \
            --center-x "$EDGE_X" \
            --center-y 240 \
            --center-z "$EDGE_Z" \
            --scale 1 \
            --width 384 \
            --height 192

          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          floating = json.loads(pathlib.Path("terrain-validation/floating.debug.json").read_text())
          if floating["surfaceMap"]["additiveColumns"] == 0:
              raise SystemExit("floating representative window contains no additive terrain")

          candidates = [(0, 0), (512, 0), (0, 512), (-512, 0), (0, -512), (512, 512), (-512, -512)]
          selected = None
          for index, (x, z) in enumerate(candidates):
              output = pathlib.Path(f"terrain-validation/cave-{index}.png")
              subprocess.check_call([
                  "./target/debug/asteria",
                  "--terrain-debug",
                  "--seed", "0",
                  "--output", str(output),
                  "--center-x", str(x),
                  "--center-y", "32",
                  "--center-z", str(z),
                  "--scale", "1",
                  "--width", "384",
                  "--height", "192",
              ])
              metadata = json.loads(output.with_suffix(".debug.json").read_text())
              if metadata["densitySlice"]["carvedPixels"] > 0:
                  selected = index
                  break
          if selected is None:
              raise SystemExit("no representative cave carve found in validation candidates")

          pathlib.Path("terrain-validation/selected-cave.txt").write_text(str(selected), encoding="utf-8")
          print(f"selected cave candidate={selected}")
          PY

      - name: Upload representative terrain windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-phase4-visual-validation
          path: terrain-validation
          if-no-files-found: error
