name: Apply biome and fluid fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-biome-fluid-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested fixes
        run: python3 tools/apply_biome_fluid_fixes_once_v4.py

      - name: Validate JSON
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in Path("data").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("All data JSON parsed successfully")
          PY

      - name: Audit localizations
        run: python3 tools/check_localizations.py

      - name: Audit structure content references
        run: python3 tools/check_content_references.py

      - name: Audit GLB assets
        run: python3 tools/check_glb_assets.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: >-
            libasound2-dev libfontconfig1-dev libudev-dev libwayland-dev
            libx11-dev libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev
          version: ubuntu-24.04-bevy-0.19-v1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --locked

      - name: Run focused regressions
        run: |
          cargo test --locked exclusive_neighbor_groups_do_not_touch
          cargo test --locked swamp_terrain_contains_both_channels_and_dry_ground

      - name: Commit validated package
        shell: bash
        run: |
          git config user.name "Sara Borges"
          git config user.email "sarakborges@outlook.com"
          git add src data
          if git diff --cached --quiet; then
            echo "No requested changes produced"
            exit 1
          fi
          git commit -m "Fix biome terrain fluids and ambient effects"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved while validating; refusing to overwrite concurrent work"
            exit 1
          fi
          git push origin HEAD:main
