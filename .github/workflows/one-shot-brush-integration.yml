name: One-shot brush icon integration

on:
  push:
    branches: [develop]
    paths: [.github/workflows/one-shot-brush-integration.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - name: Apply source-only brush icon patch
        run: |
          python tools/fix_one_shot_brush_patch.py
          python tools/one_shot_brush_patch.py
      - name: Commit and remove temporary patch machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/hud/hotbar.rs src/hud/inventory/layout.rs src/hud/inventory/sync.rs
          git rm -f -- .github/workflows/one-shot-brush-integration.yml tools/one_shot_brush_patch.py tools/fix_one_shot_brush_patch.py
          git diff --cached --check
          git commit -m 'feat(hud): render supplied brush base and optional tinted overlay in all item views'
          git push origin HEAD:develop
