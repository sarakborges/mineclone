name: Rebuild Pyro flames once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-pyro-flames-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pyro generator and metadata
        run: python tools/rebuild_pyro_once.py

      - name: Generate Pyro GLBs
        run: python assets/models/creatures/slime_pyro/generate_slime_pyro.py

      - name: Audit GLB assets
        run: python tools/check_glb_assets.py

      - name: Audit Pyro flame geometry
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          for path in [
              Path('assets/models/creatures/slime_pyro/slime_pyro.glb'),
              Path('assets/models/creatures/slime_pyro_large/slime_pyro_large.glb'),
          ]:
              b = path.read_bytes(); off = 12
              jl, _ = struct.unpack_from('<I4s', b, off); off += 8
              doc = json.loads(b[off:off+jl].decode()); off += jl
              bl, _ = struct.unpack_from('<I4s', b, off); off += 8
              binary = b[off:off+bl]
              mesh = next(m for m in doc['meshes'] if m['name'] == 'pyro_flame_tuft')
              bad = 0
              for prim in mesh['primitives']:
                  ai = prim['attributes']['NORMAL']
                  a = doc['accessors'][ai]
                  v = doc['bufferViews'][a['bufferView']]
                  base = v.get('byteOffset', 0) + a.get('byteOffset', 0)
                  for i in range(a['count']):
                      n = struct.unpack_from('<3f', binary, base + i * 12)
                      if sum(abs(c) > 0.999 for c in n) != 1 or sum(abs(c) > 1e-6 for c in n) != 1:
                          bad += 1
              if bad:
                  raise SystemExit(f'{path}: {bad} non-cardinal flame normals')
              print(path, 'Pyro flame pixel-art normals OK')
          PY

      - name: Commit rebuilt Pyro assets
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-pyro-flames-once.yml tools/rebuild_pyro_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Pyro slime with pixel-art flames"
          git push origin develop
