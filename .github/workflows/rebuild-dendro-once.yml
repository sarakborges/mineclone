name: Rebuild Dendro slime once

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  rebuild-dendro:
    if: github.event.head_commit.message == 'Add Dendro rebuild workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Restore approved slime asset state
        shell: bash
        run: |
          GOOD=aaad2601eccd99336994479261aa15c349cd0022
          git checkout "$GOOD" -- assets/models/creatures/README.md
          git checkout "$GOOD" -- assets/models/creatures/slime assets/models/creatures/slime_anemo assets/models/creatures/slime_anemo_large assets/models/creatures/slime_blob assets/models/creatures/slime_cryo assets/models/creatures/slime_cryo_large assets/models/creatures/slime_dendro assets/models/creatures/slime_dendro_large assets/models/creatures/slime_electro assets/models/creatures/slime_electro_large assets/models/creatures/slime_geo assets/models/creatures/slime_geo_large assets/models/creatures/slime_hydro assets/models/creatures/slime_hydro_large assets/models/creatures/slime_lumen assets/models/creatures/slime_lumen_large assets/models/creatures/slime_pyro assets/models/creatures/slime_pyro_large assets/models/creatures/slime_tenebra assets/models/creatures/slime_tenebra_large
          git checkout "$GOOD" -- assets/textures/creatures/slime_anemo assets/textures/creatures/slime_cryo assets/textures/creatures/slime_dendro assets/textures/creatures/slime_electro assets/textures/creatures/slime_geo assets/textures/creatures/slime_hydro assets/textures/creatures/slime_lumen assets/textures/creatures/slime_pyro assets/textures/creatures/slime_tenebra
          git checkout "$GOOD" -- data/creatures/slime_electro.json data/creatures/slime_electro_large.json tools/fix_slime_face_quads.py

      - name: Assemble Dendro generator
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          parts = sorted(Path('.github/dendro-gen').glob('part*'), key=lambda p: int(p.name[4:]))
          encoded = ''.join(p.read_text().strip() for p in parts)
          out = Path('assets/models/creatures/slime_dendro/generate_slime_dendro.py')
          out.write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          python -m py_compile assets/models/creatures/slime_dendro/generate_slime_dendro.py

      - name: Generate Dendro models
        run: python assets/models/creatures/slime_dendro/generate_slime_dendro.py

      - name: Update metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          specs = [
              ('assets/models/creatures/slime_dendro/slime_dendro.collider.json', [1.2, 1.557, 1.146], [0.0, 0.7785, 0.0], 1.557,
               'clean pale-green slime_blob body + leafy sprout/fern crown + curled tendril + square texture-driven face'),
              ('assets/models/creatures/slime_dendro_large/slime_dendro_large.collider.json', [2.496, 1.958, 1.895], [0.0, 0.979, 0.028], 1.958,
               'clean pale-green slime_blob body + broad orange flower + green central bud + fern/tendril collar + square texture-driven face'),
          ]
          for filename, size, center, height, construction in specs:
              path = Path(filename)
              data = json.loads(path.read_text())
              data['model_bounds_rest'].update(size=size, center=center, approximate_visual_height=height)
              data['materials']['expression'] = 'dedicated Dendro face texture through the square SlimeFace override'
              data['authoring']['construction'] = construction
              data['authoring']['reference'] = 'user Dendro reference: clean blob below, plant growth above; large form carries orange flower'
              path.write_text(json.dumps(data, indent=2) + '\n')

          for filename in ['data/creatures/slime_dendro.json', 'data/creatures/slime_dendro_large.json']:
              path = Path(filename)
              data = json.loads(path.read_text())
              if 'FlowerOrangeLight' not in data['unlitMaterials']:
                  data['unlitMaterials'].append('FlowerOrangeLight')
              path.write_text(json.dumps(data, indent=2) + '\n')

          readme = Path('assets/models/creatures/README.md')
          text = readme.read_text().replace(
              'with a yellow/gold palette, a central lightning antenna and restrained stepped circuit marks; no geometry from the previous Electro GLBs is reused.',
              'with a yellow/gold palette and only a central lightning antenna; all other electric motifs are texture-driven and no geometry from the previous Electro GLBs is reused.'
          )
          note = ('Dendro is rebuilt from a clean slime_blob body with no body-side ornament geometry. '
                  'The small form carries a leafy sprout/fern crown with a curled tendril; the large form carries '
                  'a broad orange flower, compact green central bud, sepals and fern/tendril foliage above the blob.')
          if note not in text:
              text = text.rstrip() + '\n\n' + note + '\n'
          readme.write_text(text)
          Path('VERSION').write_text('0.68.51\n')

          handoff = Path('HANDOFF.md')
          h = handoff.read_text()
          section = '\n'.join([
              '## 2026-09-30 — 0.68.51 Dendro reference rebuild + slime asset regression repair',
              '',
              '- O merge do Asteria core rebuild em `develop` (`48197a30ed78cc6b3eadd5f2be7fcf0d2a9c4204`) trouxe de volta versões antigas dos assets de slime e sobrescreveu o patch visual aprovado logo antes; este bloco restaura explicitamente o estado aprovado de `aaad2601eccd99336994479261aa15c349cd0022` antes de aplicar o Dendro novo.',
              '- Todos os `SlimeFace` aprovados permanecem 1:1 para texturas 64x64 e as nove faces elementais do patch do usuário são preservadas, incluindo a face própria do Electro.',
              '- Electro continua como bolota amarelo/dourada + antena central; detalhes elétricos restantes ficam na textura, sem circuitos frontais em geometria.',
              '- Dendro normal: bolota verde-clara limpa + broto, frondes de samambaia e gavinha apenas no topo.',
              '- Dendro large: bolota verde-clara limpa + flor laranja larga, botão verde compacto, sépalas e folhagem no topo.',
              '- Generator reproduzível: `assets/models/creatures/slime_dendro/generate_slime_dendro.py`; normal + large preservam os seis clips de animação existentes.',
              '- Colliders físicos continuam do corpo blob. `SlimeFace` continua em `textures/creatures/slime_dendro/face.png`.',
              '- Validação: face check 1:1 + audit de todos os GLBs antes do commit. QA visual final permanece in-game.',
              '',
              'VERSION: `0.68.51`.',
          ]) + '\n'
          if '## 2026-09-30 — 0.68.51 Dendro reference rebuild' not in h:
              insert = h.find('\n', h.find('> Handoff corrente e operacional.'))
              h = h[:insert] + '\n' + section + h[insert:]
          h = h.replace('- Branch: `architecture/asteria-core-rebuild`.', '- Branch: `develop` (Asteria core rebuild já integrado).', 1)
          h = h.replace('- PR draft: #22 `Asteria core rebuild` -> `develop`.', '- Asteria core rebuild integrado em `develop` pelo merge `48197a30ed78cc6b3eadd5f2be7fcf0d2a9c4204`.', 1)
          h = h.replace('- `develop` sincronizado até `c3821a124d37c8d22ff981a3f3fb01badf2a193e` (`0.68.49`).', '- `develop` contém o core rebuild integrado e os patches de slime subsequentes; versão de conteúdo atual `0.68.51`.', 1)
          h = h.replace('- `VERSION` acompanha agora `develop` em `0.68.49`; os cutovers internos seguintes não devem criar bumps isolados sem necessidade de release/content.', '- `VERSION` em `0.68.51`; este bump cobre mudanças de conteúdo/modelos de slime.', 1)
          handoff.write_text(h)
          PY

      - name: Validate
        shell: bash
        run: |
          python tools/fix_slime_face_quads.py --check
          python tools/check_glb_assets.py
          python - <<'PY'
          import json, struct
          from pathlib import Path
          for creature in ['slime_dendro', 'slime_dendro_large']:
              folder = creature
              path = Path('assets/models/creatures') / folder / f'{creature}.glb'
              raw = path.read_bytes()
              jlen = struct.unpack_from('<I', raw, 12)[0]
              doc = json.loads(raw[20:20+jlen].decode().rstrip())
              mats = {m['name'] for m in doc['materials']}
              assert doc['extras']['face_source'] == 'textures/creatures/slime_dendro/face.png'
              assert 'dendro_top_growth' in {m['name'] for m in doc['meshes']}
              if creature.endswith('_large'):
                  assert {'FlowerOrange', 'FlowerOrangeLight'} <= mats
              print(creature, doc['extras'])
          for cfg in ['data/creatures/slime_electro.json', 'data/creatures/slime_electro_large.json']:
              assert json.loads(Path(cfg).read_text())['textures']['SlimeFace'] == 'textures/creatures/slime_electro/face.png'
          assert Path('assets/textures/creatures/slime_electro/face.png').exists()
          print('approved Electro/face state restored')
          PY

      - name: Commit
        shell: bash
        run: |
          rm -rf .github/dendro-gen .github/workflows/rebuild-dendro-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github assets/models/creatures assets/textures/creatures/slime_anemo assets/textures/creatures/slime_cryo assets/textures/creatures/slime_dendro assets/textures/creatures/slime_electro assets/textures/creatures/slime_geo assets/textures/creatures/slime_hydro assets/textures/creatures/slime_lumen assets/textures/creatures/slime_pyro assets/textures/creatures/slime_tenebra data/creatures/slime_electro.json data/creatures/slime_electro_large.json data/creatures/slime_dendro.json data/creatures/slime_dendro_large.json tools/fix_slime_face_quads.py VERSION HANDOFF.md
          git commit -m "Rebuild Dendro slime from reference"
          git push origin HEAD:develop
