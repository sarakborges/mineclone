[package]
name = "mineclone"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[dependencies]
bevy = { version = "0.19.1", features = ["system_font_discovery"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.10"
serde = { version = "1.0", features = ["derive"] }
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1.31"
